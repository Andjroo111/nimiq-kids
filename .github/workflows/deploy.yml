name: Deploy

# Auto-deploy to Fly.io after a green CI run on main.
#
# The deploy is gated on the CI workflow (.github/workflows/ci.yml) so a red
# check/test/file-size guard blocks the deploy. The `if` guard below ensures we
# only deploy when CI concluded successfully.
#
# The build itself happens on Fly's remote builders (--remote-only), so this runner
# only needs flyctl + the FLY_API_TOKEN secret.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Never run two deploys at once; supersede an in-flight deploy with the newer commit.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Fly Deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Gate on FLY_API_TOKEN (skip cleanly if repo not provisioned)
        id: gate
        env:
          TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No FLY_API_TOKEN secret set; this repo is not provisioned for Fly. Skipping deploy (no-op)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.gate.outputs.go == 'true'
      - run: flyctl deploy --remote-only
        if: steps.gate.outputs.go == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
