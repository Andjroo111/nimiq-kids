  const pw=Math.round(clamp(L.badgeR*.46,44,76));
  const pr=L.badgeR+14+pw*.44;
  $('plus').style.cssText+=`;width:${pw}px;height:${pw}px;
      left:${Math.min(L.cx+pr*.72-pw*.50, W-10-pw)}px;
      top:${L.badgeY-pr*.72-pw*.44}px`;

  for(const [id,on] of [['mMusic',S.muteMusic],['mBell',S.muteBell]]) drawMute(id,on);
}

/* the two little icons top right: music first, then the sound at the end */
function drawMute(id,off){
  const note=`<path d="M20 3.6 8.6 6v9.2a3.4 3.4 0 1 0 1.8 3V9.1l7.8-1.6v5.3a3.4 3.4 0 1 0 1.8 3z"/>`;
  const bell=`<path d="M12 2.6a5.6 5.6 0 0 0-5.6 5.6c0 5-2 6.4-2 6.4h15.2s-2-1.4-2-6.4A5.6 5.6 0 0 0 12 2.6z"/>
              <path d="M13.6 18.6a1.9 1.9 0 0 1-3.2 0"/>`;
  const body=id==='mMusic'?note:bell;
  const fill=id==='mMusic'?'#B9BFCB':'none';
  const cross=off?`<path d="M17.4 17.4l4.4 4.4M21.8 17.4l-4.4 4.4" stroke="#B9BFCB" stroke-width="2.6" stroke-linecap="round" fill="none"/>`:'';
  $(id).innerHTML=`<svg width="30" height="30" viewBox="0 0 24 26" fill="${fill}"
     stroke="${id==='mMusic'?'none':(off?'#B9BFCB':'#E9B213')}" stroke-width="1.9"
     stroke-linejoin="round" stroke-linecap="round">
     <g fill="${id==='mMusic'?(off?'#B9BFCB':'#B9BFCB'):(off?'none':'#E9B213')}"
        stroke="${id==='mMusic'?'none':(off?'#B9BFCB':'#E9B213')}">${body}</g>${cross}</svg>`;
}

/* ---------- the pie: ours, somewhere theirs is not ----------
   Theirs sits bottom-right INSIDE the badge, over the egg. All three of these keep
   it off the egg; which one ships is Andjroo's pick, and it drags anywhere from
   there. `clock` re-parents into the countdown row so flexbox spaces it; the other
   two float over the app.                                                        */
function placePie(){
  const pie=$('pie'), arc=$('rimArc'), rim=S.pie==='rim';
  pie.style.display=rim?'none':'block';
  arc.style.display=rim?'block':'none';
  if(rim){
    const pad=10, R=L.badgeR+pad, S8=8;
    arc.setAttribute('width',R*2+S8*2); arc.setAttribute('height',R*2+S8*2);
    arc.style.cssText+=`;left:${L.cx-R-S8}px;top:${L.badgeY-R-S8}px`;
    const c=$('rimC');
    c.setAttribute('cx',R+S8); c.setAttribute('cy',R+S8); c.setAttribute('r',R);
    c.setAttribute('stroke-width',9);
    return;
  }
  const inRow = S.pie==='clock' && !S.pieXY;
  const d=Math.round(inRow ? Math.min(62,L.W*.16) : Math.min(98,L.W*.25));
  pie.setAttribute('width',d); pie.setAttribute('height',d);
  if(inRow){
    pie.classList.remove('free');
    pie.style.left=pie.style.top='';
    if(pie.parentElement!==$('clockRow')) $('clockRow').insertBefore(pie,$('clockRow').firstChild);
    return;
  }
  pie.classList.add('free');
  if(pie.parentElement!==$('pieHost')) $('pieHost').insertBefore(pie,$('pieHost').firstChild);
  let x,y;
  if(S.pieXY){ x=S.pieXY[0]*L.W; y=S.pieXY[1]*L.H }
  else{
    /* Andjroo, 2026-07-31: "the pie should be in the top left corner... it could
       overlap just a hair on the background."
       So the left edge is the margin and the HEIGHT is solved, not chosen: sit the
       disc's centre on the circle of radius (badgeR + d/2 − HAIR) about the badge
       and take the upper intersection with x = margin. That is the highest it can
       be while still touching, so it reads as tucked into the corner and the bite
       it takes out of the scene stays the same hair on every screen size. */
    const HAIR=10, m=Math.round(L.W*.046);
    x=m;
    const R=L.badgeR+d/2-HAIR, dx=L.cx-(x+d/2);
    y=L.badgeY-(Math.abs(dx)<R?Math.sqrt(R*R-dx*dx):0)-d/2;
  }
  pie.style.left=clamp(x,4,L.W-d-4)+'px';
  pie.style.top =clamp(y,Math.max(4,L.H*.055),L.H-d-4)+'px';
}
function drawPie(frac){
  const f=clamp(frac,0,1);
  if(S.pie==='rim'){
    const c=$('rimC'), R=+c.getAttribute('r'), C=2*Math.PI*R;
    c.setAttribute('stroke-dasharray',C); c.setAttribute('stroke-dashoffset',C*(1-f));
    c.setAttribute('transform',`rotate(-90 ${c.getAttribute('cx')} ${c.getAttribute('cy')})`);
    return;
  }
  const a=-Math.PI/2, b=a+Math.PI*2*f, R=52;
  const x1=60+R*Math.cos(a), y1=60+R*Math.sin(a);
  const x2=60+R*Math.cos(b), y2=60+R*Math.sin(b);
  $('pieWedge').setAttribute('d', f>=.9999
    ? `M60 8 A52 52 0 1 1 59.9 8 Z`
    : f<=0 ? '' : `M60 60 L${x1} ${y1} A${R} ${R} 0 ${f>.5?1:0} 1 ${x2} ${y2} Z`);
  $('pieHand').setAttribute('x2',x2); $('pieHand').setAttribute('y2',y2);
}
/* draggable, because everything on Andjroo's screens is */
(function dragPie(){
  const pie=$('pie'); let on=false,dx=0,dy=0;
  pie.addEventListener('pointerdown',e=>{
    // lifting it out of the countdown row: freeze it exactly where it already is,
    // so the first frame of the drag is not a jump to some other corner
    if(!pie.classList.contains('free')){
      const r=pie.getBoundingClientRect(), a=$('app').getBoundingClientRect();
      $('pieHost').insertBefore(pie,$('pieHost').firstChild);
      pie.classList.add('free');
      pie.style.left=(r.left-a.left)+'px'; pie.style.top=(r.top-a.top)+'px';
    }
    on=true; pie.classList.add('dragging');
    dx=e.clientX-pie.offsetLeft; dy=e.clientY-pie.offsetTop;
    try{ pie.setPointerCapture(e.pointerId) }catch(_){}       // can throw; never let it kill the gesture
  });
  pie.addEventListener('pointermove',e=>{                      // e.buttons is 0 under a finger
    if(!on)return; e.preventDefault();
    const d=pie.clientWidth;
    pie.style.left=clamp(e.clientX-dx,4,L.W-d-4)+'px';
    pie.style.top =clamp(e.clientY-dy,4,L.H-d-4)+'px';
  });
  const up=()=>{ if(!on)return; on=false; pie.classList.remove('dragging');
    S.pieXY=[pie.offsetLeft/L.W, pie.offsetTop/L.H]; save(); layoutRun(L.W,L.H) };
  pie.addEventListener('pointerup',up); pie.addEventListener('pointercancel',up);
})();

/* ---------- the scroll columns ---------- */
function fillCol(el,vals){
  el.innerHTML=vals.map(v=>`<div class="n">${String(v).padStart(2,'0')}</div>`).join('');
}
const MINS=Array.from({length:60},(_,i)=>i);
const SECS=[0,5,10,15,20,25,30,35,40,45,50,55];
fillCol($('colMin'),MINS); fillCol($('colSec'),SECS);

/* ⚠️ The list is NEVER rebuilt while a finger is on it — the handler only reads the
   scroll offset and sets opacity. Rebuilding under the gesture is what made an
   earlier picker in this project twitch once and then ignore the finger. */
function wireCol(el,vals,onPick){
  const rowH=()=>el.querySelector('.n')?.offsetHeight||40;
  let t=0;
  const paint=()=>{
    const h=rowH(), i=el.scrollTop/h;
    el.querySelectorAll('.n').forEach((n,k)=>{
      const d=Math.abs(k-i);
      n.style.opacity = d<.5 ? 1 : d<1.6 ? .30 : 0;   // solid, faded, gone
    });
  };
  el.addEventListener('scroll',()=>{
    paint();
    clearTimeout(t);
    t=setTimeout(()=>{ const k=Math.round(el.scrollTop/rowH()); onPick(vals[clamp(k,0,vals.length-1)]) },90);
  },{passive:true});
  el._paint=paint;
  el._goto=v=>{ const k=Math.max(0,vals.indexOf(v)); el.scrollTop=k*rowH(); paint() };
}
wireCol($('colMin'),MINS,v=>{ S.min=v; save(); syncStart() });
wireCol($('colSec'),SECS,v=>{ S.sec=v; save(); syncStart() });
function syncStart(){
  /* in job mode there is no "set a time" state to fall into — the length arrived
     with the job and Start is always live once the host has spoken. */
  $('start').textContent = JOB ? JT.s.start : ((S.min||S.sec)?'Start':'Set a time');
}

/* ---------- screens ---------- */
let screen='set';
function go(name){
  screen=name;
  document.body.className=name;
  for(const [id,n] of [['scSet','set'],['scRun','run'],['scHatch','hatch']])
    $(id).classList.toggle('on',n===name);
  layout();
}

/* ---------- the run loop: one read of the rig per frame ---------- */
/* ⚠️ IMPORTED LATE AND VERSIONED. A static `import './confetti.js'` carries no
   cache key, so in the app it is the one file under /kid/timer/ that has to be
   re-fetched on every open — and a static import also blocks this module from
   running until it lands, which puts 12KB in front of the egg for no reason.

   ⚠️ AND NOT AWAITED. THIS WAS THE FLASH (2026-08-01). `await` here does not block
   this module against anything harmless — it suspends it, mid-file, between
   fillCol() filling the two columns with sixty numbers and layout() giving them a
   height. The browser paints in that gap, and what it paints is the minute column at
   its natural 1440px running the length of the phone: Andjroo's "list of things". It
   was one round trip wide, so it survived every bandwidth: still ~80ms on localhost
   at 8 Mbps, 200-400ms on a phone over the tunnel.
   A late import is right; awaiting it at the top level is what was wrong. Confetti
   is fired by a tap or by the hatch, and the earliest of those is seconds away, so
   the import runs in the background and lands into `conf` when it arrives. The stub
   is not a fallback — it is what "nothing to clear yet" honestly does. */
let conf={ celebrate(){}, clear(){}, stop(){} };
import('./confetti.js?v='+encodeURIComponent(VER))
  .then(m=>{ conf=m.createConfetti($('conf')) })
  .catch(e=>console.error('confetti',e));

/* ---------- THE HATCH SOUNDS ----------
   Andjroo, 2026-08-02: "we need that cheering to happen when the egg cracks every time,
   and the egg cracks sound and the confetti and stuff sound in the actual app, not just
   the demo video." These are the SAME THREE FILES the competition film uses, re-encoded
   from 44.1k WAV to MP3: 328KB becomes 47KB and neither the crack nor the cheer can tell.
   Source of truth for the audio is `video-studio/public/audio/nimiqkids/sfx/`.

   ⚠️ MP3, NOT AAC, AND THAT IS A TESTABILITY DECISION. These went out as .m4a first and
   every browser that matters plays it — but Playwright's Chromium ships without the
   proprietary decoders, so `canPlayType('audio/mp4')` is a flat NO there and the hatch
   proof could only ever report NotSupportedError. A format the harness cannot decode is
   a format nothing can assert on, and silent audio is the failure mode this whole change
   exists to prevent. MP3 plays in Chromium, Chrome, Safari, iOS and Firefox alike, and at
   this length it is SMALLER than the AAC was. Everything ElevenLabs returns for the sound
   catalog is already MP3, so nothing downstream needs an encoder either.

   ⚠️ THE CRACK LANDS ON THE BURST, NOT ON `breaking`. The film already made this mistake
   once and fixed it, and the fix is written down in EggColdOpen.tsx: anchoring the crack
   on the rig's flag left an audible hole, which Andjroo heard as "a gap between when the
   timer actually runs out and the crack happening". `breaking` goes true when the egg
   starts to SWELL — the halves do not fly until the hold phase is over. The rig publishes
   that shape as BRK={hold:.46, fall:.50, settle:.80} (wiggle.html), so the burst is at
   brk.t = 0.46s. The confetti below was dialled to 420ms by eye months earlier; the two
   numbers landing a frame apart, found by completely different means, is the check.

   ⚠️ EVERY URL CARRIES ?v=VER, like every other asset under /kid/timer/. Un-stamped, the
   m4a becomes the one file here that cannot be cached hard — see the SRC warning up top.

   ⚠️ PRIMED ON THE START TAP, BECAUSE IT IS THE ONLY GESTURE WE GET. iOS will not play
   audio that was never unlocked inside a user gesture, and the hatch is minutes past the
   last tap by construction. Start plays-and-pauses each clip, which both unlocks it and
   pulls the bytes down while the egg is still counting. A hatch that has to fetch 27KB
   before it can cheer has already missed the burst it was answering. */
/* ⚠️ SOUND IS BACK ON. Andjroo, 2026-08-27: "the music's not working... no sound at all
   right now, at least from my testing." It was not broken — it was switched off on
   2026-08-03 ("lets remove all sound for now, it needs some work") and nothing about the
   pause was visible from the app, so a silent bed reads exactly like a missing file.
   Nothing below was ever deleted, which is why turning it back on is still one line: the
   files, the baked levels, the iOS unlock and the generator in tools/sound are as they
   were built and proven.

   ⚠️ THE GUARD STAYS AT EVERY PLAY SITE, NOT AT ONE CLEVER CHOKE POINT. sfxPrime()
   reaches SFX directly while bedStart()/shot()/preview() go through clip(), so gating
   clip() alone would leave the Start-tap prime audible — which is the exact bug Andjroo
   heard before ("sometimes when I press start it makes the celebratory sound"). Five
   guards, each on the function that can produce a sound, is the version that cannot be
   half-right, and it is what makes flipping this line safe in both directions.
   ⚠️ tools/eggtimer-soundproof.py asserted play() is NEVER called. That assertion is the
   opposite of the shipped behaviour now — it proves the pause, not the product — so read
   it as the off-switch's test, not as a gate this has to satisfy. */
const SOUND_ON=true;
const SFX_SRC={ anticipation:'sfx/anticipation.mp3', crack:'sfx/crack-real.mp3', cheer:'sfx/cheer.mp3',
                count5:'sfx/count-5.mp3', count4:'sfx/count-4.mp3', count3:'sfx/count-3.mp3',
                count2:'sfx/count-2.mp3', count1:'sfx/count-1.mp3' };
/* ⚠️ THE LEVELS ARE BAKED INTO THE FILES, NOT SET HERE, AND THAT IS AN iOS DECISION.
   `HTMLMediaElement.volume` is READ-ONLY on iOS — assigning it is silently ignored, and
   the family tablet is the device this is for. Setting .volume shipped a mix that was
   right on a laptop and wrong on the only screen that matters. So each file is encoded
   at its own level (`lame --scale`, from the film's mix): crack 1.0, cheer 0.55,
   anticipation 0.7, the count 0.95 with "one" at 1.0. Nothing scales anything at
   runtime, so every platform hears the same balance.
   ⚠️ Re-dialling the mix therefore means RE-ENCODING, not editing a number here. */
const SFX={};

/* ---------- THE THREE LISTS THAT WERE NAMED AND SILENT ----------
   The sounds sheet and the reminder sheet have been fully built since 2026-07-31 and
   every choice toasted "Coming soon", because the repo held no audio. They hold audio now.

   ⚠️ THESE ARE LOADED ON DEMAND, NOT PRIMED WITH THE HATCH. The hatch set is five clips
   the kid always hears, so priming all of them on Start is right. These are picked ONE at
   a time out of twenty, and priming twenty would fetch ~750KB to play ~20KB of it. Each is
   fetched when it is actually chosen — which is the sheet, not the run, so there is a tap
   behind it and a whole countdown before it is needed.

   ⚠️ AND THEY ARE UNLOCKED ON THE SAME START TAP. An element created later than the
   gesture is not unlocked by it on iOS, so `sfxPrime()` re-runs over whatever the kid has
   chosen — see the loop there. Choosing from the sheet also primes immediately, because
   the tap that chose it is itself a gesture. */
const END_SRC={ chime:'sfx/end-chime.mp3', fanfare:'sfx/end-fanfare.mp3',
                bell:'sfx/end-bell.mp3', pop:'sfx/end-pop.mp3' };
const BED_SRC={ lullaby:'sfx/bed-lullaby.mp3', bounce:'sfx/bed-bounce.mp3',
                space:'sfx/bed-space.mp3', clock:'sfx/bed-clock.mp3' };
const SAY_SRC={};
for(const r of ['goodjob','youdidit','hooray','love','shoes','socks',
                'bath','bed','tidy','teeth','eat','screenoff'])SAY_SRC[r]='sfx/say-'+r+'.mp3';

/** One <audio> per url, made once and kept. `loop` is only ever true for a bed. */
const POOL={};
function clip(src,loop){
  if(!src)return null;
  if(!POOL[src]){
    const a=new Audio(src+'?v='+encodeURIComponent(VER));
    a.preload='auto'; a.loop=!!loop;
    POOL[src]=a;
  }
  return POOL[src];
}
/** Unlock a chosen clip inside whatever gesture is running right now. Same muted
    play-then-pause as sfxPrime, and the same reason: an audible prime is a bug. */
function unlock(a){
  if(!a||a.dataset.ok)return;
  a.dataset.ok='1'; a.muted=true;
  a.play().then(()=>{ a.pause(); a.currentTime=0; a.muted=false })
          .catch(()=>{ a.muted=false });
}

/* The bed under a running timer. Started by beginRun, stopped by the hatch — never by the
   screen, because the hatch screen is still the same run and the kid has not left it. */
let bed=null;
function bedStart(){
  if(!SOUND_ON)return;
  bedStop();
  if(S.muteMusic)return;
  bed=clip(BED_SRC[S.during],true);
  if(bed){ try{ bed.currentTime=0; bed.muted=false; bed.play().catch(()=>{}) }catch(e){} }
}
function bedStop(){ if(bed){ try{ bed.pause(); bed.currentTime=0 }catch(e){} bed=null } }
/** Play a one-shot by url, rewinding first so a repeat inside its own length still fires. */
function shot(src){
  if(!SOUND_ON)return;
  const a=clip(src,false); if(!a)return;
  try{ a.currentTime=0; a.muted=false; a.play().catch(()=>{}) }catch(e){}
}

/* Auditioning from the sheets. Exactly one preview is ever audible: tapping down the list
   is the normal way to use these, and four overlapping lullabies is not a comparison.
   ⚠️ A BED PREVIEW IS CUT SHORT ON PURPOSE. It is a ten-second loop; left alone it plays
   under the sheet, under the set screen and into the next run. PREVIEW_MS is long enough
   to know whether you like it and short enough that forgetting to stop it costs nothing. */
const PREVIEW_MS=4200;
let previewing=null, previewTimer=0;
function stopPreview(){
  if(previewTimer){ clearTimeout(previewTimer); previewTimer=0 }
  if(previewing){ try{ previewing.pause(); previewing.currentTime=0 }catch(e){} previewing=null }
}
function preview(src,loop){
  stopPreview();
  if(!SOUND_ON)return;
  if(!src)return;                       // "Off" is a choice, and it makes no sound
  const a=clip(src,loop); if(!a)return;
  unlock(a);
  previewing=a;
  try{ a.currentTime=0; a.muted=false; a.play().catch(()=>{}) }catch(e){}
  if(loop)previewTimer=setTimeout(stopPreview,PREVIEW_MS);
}
function sfxPrime(){
  if(!SOUND_ON)return;
  for(const [k,src] of Object.entries(SFX_SRC)){
    if(SFX[k])continue;
    const a=new Audio(src+'?v='+encodeURIComponent(VER));
    a.preload='auto';
    /* ⚠️ MUTED FOR THE UNLOCK, AND THIS IS THE BUG ANDJROO HEARD. play() resolves AFTER
       playback has begun, so a plain play()-then-pause() leaks the first few ms of audio
       — which on the cheer is an audible whoop the instant Start is tapped. It was racy,
       so it happened "sometimes", usually on the first run of a session when the file was
       still arriving. Muted playback still unlocks the element on iOS (that is the whole
       point of the silent-unlock trick) and is inaudible while doing it. Unmute after the
       pause lands, never before. */
    a.muted=true;
    a.play().then(()=>{ a.pause(); a.currentTime=0; a.muted=false })
            .catch(()=>{ a.muted=false });
    SFX[k]=a;
  }
  /* The chosen bed, sting and reminder ride the same gesture. They are made on demand, so
     one chosen from the sheet before this run has never been inside a gesture yet. */
  [BED_SRC[S.during], END_SRC[S.end], SAY_SRC[S.reminder]]
    .forEach((src)=>{ if(src)unlock(clip(src, src===BED_SRC[S.during])) });
}
function sfxPlay(k){
  if(!SOUND_ON)return;
  const a=SFX[k]; if(!a)return;
  /* ⚠️ REWIND FIRST. play() on an element that is already playing does nothing at all,
     so a second hatch inside the 2s of the cheer would land in silence.
     ⚠️ AND UNMUTE. A prime that was still in flight when the run ended would otherwise
     leave this element muted for its one real moment. */
  try{ a.currentTime=0; a.muted=false; a.play().catch(()=>{}) }catch(e){}
}
/* The burst is the end of the hold phase. The cheer answers it 0.2s later, which is the
   same beat the film puts between crack-real and cheer (BURST_F vs BURST_F+6 at 30fps). */
/* The burst is the end of the hold phase; the cheer answers 0.2s later, the same beat
   the film puts between crack-real and cheer. SAY_MS clears the cheer's 2.03s tail. */
const BURST_MS=460, CHEER_MS=660, SAY_MS=2900;
/* ⚠️ THE POP IS UNTOUCHED. `makeDefaults()` is byte-for-byte the approved rig (rings,
   ticks, colours, speed, life) and stays that way — the only thing overridden is HOW
   MANY of them a burst fires, and that is not a dial, it is the same DENSITY carried
   onto a bigger canvas. `celebrate()` already scatters each pop across the whole
   canvas, so the field went from the badge to the phone the moment #conf did; two
   pops that read as a shower inside a 342px disc read as a sprinkle across 390x844,
   which is 2.8 times the area. Same pops per unit of screen, more screen. */
const BADGEAREA=342*342;                       // the disc the defaults were dialled in
function burstPops(){
  const r=$('conf').getBoundingClientRect();
  const k=(r.width*r.height)/BADGEAREA;
  return clamp(Math.round(2*k),2,8);
}
let hatched=false;
/* ---------- THE LAST FIVE SECONDS, COUNTED OUT LOUD ----------
   Andjroo, 2026-08-03: "we already have a five second countdown, we should have the same
   thing for this — you have the five-second countdown on the video." Same five recordings,
   same four children, so the app and the film count in one voice.

   ⚠️ THE SECOND IS DERIVED, THE ANNOUNCEMENT IS LATCHED. `st.left` is a float read every
   animation frame, so anything that fires on a comparison alone fires sixty times a
   second. `said` holds the number last spoken and nothing repeats until the number
   actually changes. Math.ceil maps (4,5] to "five", which is what a person means by five
   seconds left, and it puts "one" in (0,1] — finishing a beat before the shell goes,
   exactly where the film places it against the rim.

   ⚠️ RESET ABOVE FIVE, NOT ON START. The +/- button can push a running clock back up out
   of the countdown (RIG.addTime), and a run that climbs to 0:30 and comes back down has
   to be able to count again. Latching on the way in and clearing on the way out costs one
   comparison and makes that free. */
let said=0;
const COUNT_FROM=5;
function countdownTick(left){
  const s=Math.ceil(left);
  if(s>COUNT_FROM){ said=0; return }
  if(s<1||s===said)return;
  said=s;
  if(!S.muteBell)sfxPlay('count'+s);
}
function mmss(t){ const m=Math.floor(t/60), s=Math.floor(t%60);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0') }
function tick(){
  requestAnimationFrame(tick);
  if(!RIG)return;
  const st=RIG.state();
  if(screen==='run'||screen==='hatch'){
    $('clock').textContent=mmss(st.left);
    $('hatchClock').textContent=mmss(st.left);
    drawPie(st.total?st.left/st.total:0);
  }
  // the voices ride the same clock the dial does, and only while it is really running
  if(screen==='run'&&!hatched&&!st.breaking)countdownTick(st.left);
  // the clock running out IS the break — the rig owns that, we only follow it
  if(st.breaking&&screen==='run'&&!hatched){ hatched=true; go('hatch');
    /* ⚠️ THE HATCH IS NOT THE END-SOUND PICKER, and it does not read `S.end`. Andjroo,
       2026-08-02, asked for the cheer "every time" — the crack and the cheer are what
       the egg DOES, the way the confetti is, so the six choices on the sounds sheet
       layer on top of this rather than replacing it. The mute switch is a different
       question and it still wins: a mute button that does not mute is a bug. */
    /* ⚠️ THE BED STOPS FIRST, and before anything else is asked to be heard. Ten seconds
       of looping lullaby under a shell breaking is the one combination that makes both
       sound like a mistake. */
    bedStop();
    if(!S.muteBell){
      sfxPlay('anticipation');                          // holds the wobble
      setTimeout(()=>sfxPlay('crack'),BURST_MS);        // the shells fly apart
      setTimeout(()=>sfxPlay('cheer'),CHEER_MS);        // the four kids answer it
      /* The chosen end sting rides WITH the crack: "your time is up" is the same instant
         the shell goes, and the cheer answers both. `cheer` is not in END_SRC on purpose —
         picking it means the cheer that already plays, not a second set of children
         arriving a frame later. */
      if(END_SRC[S.end])setTimeout(()=>shot(END_SRC[S.end]),BURST_MS);
      /* ⚠️ THE REMINDER WAITS FOR THE ROOM TO CLEAR. The cheer starts at 660ms and runs
         2.03s, so anything before ~2.7s is spoken over children shouting and is simply
         lost. This is the "what next" line — it only works if it is the last thing said. */
      if(SAY_SRC[S.reminder])setTimeout(()=>shot(SAY_SRC[S.reminder]),SAY_MS);
    }
    setTimeout(()=>conf.celebrate({burstPops:burstPops()}),420);
    /* ⚠️ THE JOB IS REPORTED FINISHED FROM HERE, and only from here. The egg breaks
       because the clock ran out or because the kid tapped done, and this is the one
       line both of those arrive at — telling the host from the button as well would
       post the job twice on the path that goes through both. Guarded by `hatched`,
       so it is once per run however the run ended. */
    if(JOB)post('finish');
  }
}
requestAnimationFrame(tick);

/* ---------- IT CRACKS A DIFFERENT WAY EVERY RUN ----------
   Andjroo, 2026-07-31: "we should have randomized the egg cracking, but I only ever
   see one version of this."
   Nothing was broken — the app had simply never chosen. `RIG.setPattern()` has always
   existed and timer.html never called it, so every run in this app got whatever the
   TUNING PAGE happened to be left on, saved in the rig's own localStorage. One egg,
   forever, and it was the tuning page's egg rather than a decision the app made.

   ⚠️ This reverses a rule that is still written in HANDOFF §1 — "the egg cracks apart
   the same way every time. No randomised outcome." That rule was protecting the
   AUTHORING (a pattern plays identically once chosen, so it can be dialled in); it
   was never about the app, and Andjroo has now made the app's call the other way.

   ⚠️ Rolled at Start, BEFORE go(). setPattern() re-cuts the halves, rebuilds the
   fragments and re-derives the landed pose — mid-run that would rebuild the egg
   underneath a countdown that is already breaking it.

   ⚠️ And never the same one twice running. A fair roll over five repeats about one
   run in five, and a repeat is the one outcome that reads as "it did not randomise" —
   which is the exact complaint this is fixing. Excluding the last one is derived from
   what he is judging (does it look random), not a dial. */
/* ⚠️ Both rolls avoid the last one the SAME way, and it is one helper rather than two,
   because the two pools behave differently at the edges: the crack pool is always 5,
   the character pool is whatever the kid ticked and is legitimately 1. Excluding the
   previous pick out of a pool of one leaves nothing to choose. */
function rollFrom(pool,last){
  if(!pool.length)return null;
  const p=pool.length>1?pool.filter(x=>x!==last):pool;
  return p[Math.floor(Math.random()*p.length)];
}
let lastPat=null, lastHero=null;
function rollPattern(){
  if(!RIG||!RIG.setPattern)return null;
  if(!CRACK_PATTERNS.length&&RIG.patterns)CRACK_PATTERNS=RIG.patterns()||[];
  const n=rollFrom(CRACK_PATTERNS,lastPat);
  if(n!=null&&RIG.setPattern(n)){ lastPat=n; return n }
  return null;
}
function rollHero(){
  if(!RIG||!RIG.setHero)return null;
  /* ⚠️ ROLLS FROM WHAT HAS LANDED, not from what is ticked. The characters load after
     the first paint now, so for a moment after arriving the ticked set can hold ids
     with no image behind them — and setHero() refuses those the way setPattern()
     always has. Narrowing the pool is the same idea one step earlier: ask for a
     character that exists rather than being told no and keeping the last one. The
     fallback to the whole set matters for a rig old enough not to have loaded(). */
  const set=heroSet();
  const pool=RIG.loaded?set.filter(id=>RIG.loaded(id)):set;
  const id=rollFrom(pool.length?pool:set,lastHero);
  if(id&&RIG.setHero(id)!==false){ lastHero=id; return id }
  return null;
}

/* ---------- controls ---------- */
$('start').onclick=()=>{
  /* ⚠️ FIRST LINE, ABOVE EVERY GUARD, AND THAT IS THE POINT. This is the only certain
     user gesture in the whole run — job mode's Start is a round trip, so beginRun() can
     arrive from a postMessage with no gesture behind it at all, and iOS would refuse the
     cheer minutes later with nothing on screen to say why. Priming on a tap that then
     falls out of a guard below costs three paused Audio elements and nothing else. */
  sfxPrime();
  /* ⚠️ JOB MODE READS THE JOB, NOT THE DIAL, and it has to be asked FIRST. The dial's
     minutes and seconds are restored from the kid's own localStorage, so a kid whose
     last dock timer was 0:00 would fall out of the `secs<1` guard below and Start
     would do nothing on a job that has a perfectly good length of its own. */
  const secs=JOB?JT.secs:(S.min*60+S.sec); if(secs<1)return;
  /* ⚠️ NOT STARTABLE WITHOUT A RIG. rollPattern() and rollHero() have always checked
     this and RIG.go() never did, so a tap that beat the rig's hook threw on the last
     line — after go('run') had already switched the screen, which left the run screen
     up with a dead clock and no way back except the dock. Normally the cover makes
     this unreachable; it stops being unreachable exactly when the cover gives up at
     CAP, which is the slow connection where an early tap is most likely. Staying on
     the set screen is the honest answer: the button has not worked yet. */
  if(!RIG)return;
  /* JOB MODE: the server owns the job's clock, so Start is a round trip, not a local
     event — the host marks the task started, and only what comes BACK is allowed to
     move the screen. Starting here and telling the host afterwards would leave a
     running egg over a task the server never started if the call failed.
     ⚠️ Below the `if(!RIG)` guard on purpose: an early tap must not post the task
     started when the screen it would hand back to cannot run. */
  if(JOB){ if(JT.started)return; JT.started=true; $('start').disabled=true; post('start'); return }
  beginRun(secs);
};
/* the one way into a run, whichever screen asked for it. */
function beginRun(secs){
  if(!RIG)return;
  /* `said` alongside `hatched`: both are per-run state, and a second run of the same
     length would otherwise start with the previous run's "one" still latched and count
     from four. */
  hatched=false; said=0; conf.clear(); bedStart();
  /* ⚠️ Both rolls happen HERE, before go(). setPattern() re-cuts the halves and
     re-derives the landed pose, and the landing is framed off the CHARACTER's width
     (the gap is the hole it left) — so the character has to be settled before the
     break is built, not swapped in when the egg opens. */
  rollPattern(); rollHero();
  go('run'); RIG.go(secs);
}
let paused=false;
$('btnPause').onclick=()=>{
  paused=!paused;
  if(paused)RIG.pause(); else RIG.resume();
  $('icPause').innerHTML = paused
    ? `<path d="M7.4 4.9a1 1 0 0 1 1.5-.86l9.2 6.1a1 1 0 0 1 0 1.72l-9.2 6.1a1 1 0 0 1-1.5-.86z"/>`
    : `<rect x="6.4" y="4.6" width="4.2" height="14.8" rx="1.6"/><rect x="13.4" y="4.6" width="4.2" height="14.8" rx="1.6"/>`;
};
$('btnStop').onclick=()=>{ paused=false; conf.clear(); RIG.reset(); go('set') };
/* JOB MODE: "I'm done!" before the clock. It does not report anything itself — it
   breaks the egg, and tick() reports the finish when the break starts, so the kid who
   waits and the kid who taps travel the same last few lines. */
$('btnJobDone').onclick=()=>{ if(RIG&&!hatched)RIG.hatchNow() };
$('done').onclick  =()=>{ conf.stop(); conf.clear(); RIG.reset(); hatched=false;
  /* in job mode there is no set screen to go back to — the job is finished and the
     chart is what comes next, which only the host can show. */
  if(JOB)return post('done');
  go('set') };
$('stepUp').onclick=()=>RIG&&RIG.addTime(60);
$('stepDn').onclick=()=>RIG&&RIG.addTime(-60);

/* ---------- the host channel (job mode only) ----------
   Four messages in, four out, and the split is always the same: the HOST owns
   anything the server knows about (the job, its length, whether it is already
   running, when it is finished) and THIS FILE owns the egg. Neither reaches past
   that line — which is why the timer never calls an API and the host never touches
   the rig.

     in   init  the job: title, length, labels, and whether it is mid-run already
          go    the host has marked it started; here is the length to run
          sync  the wall clock says this much is left (see RIG.setLeft)
     out  ready this document is listening
          start the kid tapped Start
          finish the egg is breaking — the job is done
          done  the kid tapped Done on the hatch screen

   ⚠️ SOURCE-CHECKED, NOT ORIGIN-CHECKED. Host and timer are same-origin (the app
   serves both), so an origin test would pass for any other frame the app has open;
   what actually identifies the host is that it is the window this document is
   embedded in. */
/* ⚠️ THE FRAME OUTLIVES THE SCREEN, so somebody has to say when to stop. `eggtimer.js`
   deliberately never re-creates this iframe (re-creating it would restart the rig
   mid-countdown), which means the back chevron leaves this document alive and, with a bed
   chosen, still playing a lullaby over the chore chart. The host posts `hush` on the way
   out. Registered unconditionally, unlike the job listener below, because the dock opens
   the timer without a job and the dock is where a bed is most likely to be running. */
window.addEventListener('message',e=>{
  if(HOST&&e.source!==HOST)return;
  if(e.data&&e.data.job==='hush'){ bedStop(); stopPreview() }
});
if(JOB){
  window.addEventListener('message',e=>{
    if(e.source!==HOST)return;
    const m=e.data; if(!m||typeof m.job!=='string')return;
    if(m.job==='init'){
      JT.secs=Math.max(1,Math.round(Number(m.secs)||0));
      JT.title=String(m.title??''); JT.emoji=String(m.emoji??'');
      if(m.strings)Object.assign(JT.s,m.strings);
      $('jobName').textContent=JT.title;
      $('jobTime').textContent=jobClock(JT.secs);
      /* ⚠️ THE JOB'S REAL ICON, not the emoji character. Andjroo, 2026-08-01: "the icon
         is incorrect" — it was. Every other surface draws `iconUrl`, the asset
         src/task-icons resolves from the emoji (chart.js taskCard, done.js jobFace);
         only this screen was rendering the raw glyph. Falls back to the emoji exactly
         the way those two do, and hides itself rather than leaving a broken image if
         the asset 404s. */
      const ic=$('jobIcon');
      if(m.iconUrl){ ic.hidden=false; ic.onerror=()=>{ ic.hidden=true; showEmojiIcon() };
                     ic.src=m.iconUrl }
      else { ic.hidden=true; showEmojiIcon() }
      layout();   // the card's height decides where it hangs, so place it once it is filled
      /* ⚠️ Set here, not in the markup. The button ships EMPTY so there is no English
         to flash before the host's locale arrives, and so a missing `strings` cannot
         leave a lie on screen — an unlabelled pill is obviously broken, a wrongly
         labelled one is not. */
      $('btnJobDone').textContent=JT.s.done;
      syncStart();
      /* already running when the kid opened it: no set screen, no second Start, and
         no asking the server again — straight into the run at what is really left. */
      if(m.running){ JT.started=true;
        whenRig.then(()=>beginRun(Math.max(1,Math.round(Number(m.left)||JT.secs)))) }
    }
    else if(m.job==='go'){ whenRig.then(()=>beginRun(Math.max(1,Math.round(Number(m.secs)||JT.secs)))) }
    else if(m.job==='sync'){ if(RIG&&RIG.setLeft)RIG.setLeft(Number(m.left)||0) }
  });
  post('ready');
}
$('mMusic').onclick=()=>{ S.muteMusic=!S.muteMusic; save(); drawMute('mMusic',S.muteMusic) };
$('mBell').onclick =()=>{ S.muteBell =!S.muteBell;  save(); drawMute('mBell', S.muteBell) };

/* ---------- the tray's egg is THE egg ----------
   Same source of truth as the shell the rig clips to, so the glyph cannot drift from
   the art the way the hand-drawn one had. Fitted to the 24 viewBox by HEIGHT — the egg
   is the taller axis, and fitting by width would leave it clipped top and bottom.
   ⚠️ Decimated. 720 points across 18px is ~40 points per pixel: all of them would be
   an 18KB `d` attribute describing detail no one can see, and the SVG rasteriser walks
   every one of them on every paint. Every 10th point still puts a vertex every 0.25px.
   ⚠️ The inset is HALF THE STROKE, not a margin. A path is stroked centred on itself,
   so a curve run to the edge of the box loses the outer half of its own line. */
const GLYPH_STROKE=1.9, GLYPH_BOX=24;
function fitEggGlyph(pts){
  const M=GLYPH_STROKE/2+.45;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const [x,y] of pts){ if(x<x0)x0=x; if(y<y0)y0=y; if(x>x1)x1=x; if(y>y1)y1=y }
  const k=(GLYPH_BOX-2*M)/(y1-y0), w=(x1-x0)*k;
  const ox=(GLYPH_BOX-w)/2-x0*k, oy=M-y0*k;
  const at=([x,y])=>[x*k+ox, y*k+oy];

  const step=Math.max(1,Math.round(pts.length/72));
  const d=pts.filter((_,i)=>i%step===0).map(at)
             .map(([x,y],i)=>(i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)).join('')+'Z';

  /* The crack is measured off the egg rather than drawn beside it: it starts ON the
     outline, crosses, and ends ON the outline, which is the one thing the generated
     crack art is required to do (HANDOFF §0 — "every crack must START at the shell's
     outer edge and cut through the outline itself"). So the span is the egg's OWN
     width at that height, found from the same points. */
  const top=M, bot=GLYPH_BOX-M, yc=top+(bot-top)*.60;
  let xl=1e9, xr=-1e9;
  for(const p of pts){ const [x,y]=at(p);
    if(Math.abs(y-yc)<(bot-top)*.045){ if(x<xl)xl=x; if(x>xr)xr=x } }
  if(!(xr>xl))return {d};
  const n=4, dx=(xr-xl)/n, a=(bot-top)*.042;
  let c='M'+xl.toFixed(2)+' '+yc.toFixed(2);
  for(let i=1;i<=n;i++) c+='L'+(xl+dx*i).toFixed(2)+' '+(yc+(i%2?-a:a)).toFixed(2);
  return {d, crack:c};
}
fetch('egg-outline.json?v='+VER).then(r=>r.json()).then(j=>{
  if(!j||!j.pts||!j.pts.length)return;
  const g=fitEggGlyph(j.pts);
  $('glyphEgg').setAttribute('d',g.d);
  if(g.crack)$('glyphCrack').setAttribute('d',g.crack);
}).catch(()=>{});   // the authored fallback stays on screen

/* ---------- the toast ----------
   One call, and it works out where to sit from what is already on screen: above the
   sheet that raised it, or off the bottom of the phone when nothing is open. */
let toastT=null;
function toast(msg){
  const t=$('toast'); t.textContent=msg;
  const open=document.querySelector('.sheet.on');
  const H=$('app').clientHeight;
  t.style.bottom=(open?Math.round(open.getBoundingClientRect().height)+12
                      :Math.round(H*.07))+'px';
  t.classList.add('on');
  clearTimeout(toastT);
  toastT=setTimeout(()=>$('toast').classList.remove('on'),2000);
}

/* ---------- sheets ---------- */
/* The close mark and the selected mark are the two things every sheet shares, and
   both were wrong in the same way: a font character standing in for a drawn shape.
   ⚠️ VERBATIM from @nimiq/style close.svg via the registry (`nq info close-button`)
   — a disc with the X knocked out of it by fill-rule:evenodd, so it is ONE path and
   the cross can never sit off-centre in its circle. Do not redraw it. */
const XICON='<svg width="30" height="30" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M3.528 3.52c4.683-4.684 12.275-4.686 16.96-.005 4.678 4.69 4.678 12.28 0 16.97-4.685 4.68-12.277 4.678-16.96-.005-4.682-4.684-4.682-12.276 0-16.96zm13.145 13.133a1 1 0 0 0 .036-1.374l-3.11-3.11a.25.25 0 0 1 0-.352l3.11-3.11a1 1 0 1 0-1.414-1.415l-3.11 3.11a.25.25 0 0 1-.354 0l-3.11-3.11a1 1 0 0 0-1.41 1.415l3.11 3.11a.249.249 0 0 1 0 .353l-3.11 3.109a1 1 0 0 0 0 1.415c.396.38 1.021.38 1.416 0l3.109-3.11a.252.252 0 0 1 .354 0l3.11 3.11a1 1 0 0 0 1.373-.041z" fill="currentColor"/></svg>';
const TICK='<i class="tick"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.8 9.6 17.4 19 7.2"/></svg></i>';
document.querySelectorAll('.sheet').forEach(s=>{
  const b=document.createElement('button');
  b.className='sclose'; b.setAttribute('aria-label','Close'); b.innerHTML=XICON;
  b.onclick=()=>sheet(null);
  s.insertBefore(b,s.firstChild);
});
/* ⚠️ THE LAZY BUILD LIVES HERE, not at the two buttons that happen to open these
   sheets. It was at the buttons first, and tools/sheetproof.py went straight through
   TIMER.sheet('shReminder') — the public API — onto an empty grid. Any caller that
   opens a sheet by id is entitled to a sheet with its contents in it, and the app is
   about to be one of those callers. One seam, not two entry points. */
/* ⚠️ OPENING THE HATCH SHEET IS ALSO A REQUEST FOR THE ART. The other eighteen
   characters are fetched on idle after arriving; a kid who goes straight to the
   picker is asking for all of them NOW, and this is the only moment that knows so.
   loadRest() is idempotent, so asking twice costs nothing. */
const LAZY={shReminder:()=>buildRemGrid(),
            shEgg:()=>{ buildEggGrid(); if(RIG&&RIG.loadRest)RIG.loadRest() },
            shBg:()=>buildBgGrid()};
const built=new Set();
function sheet(id){
  if(id&&LAZY[id]&&!built.has(id)){ built.add(id); LAZY[id]() }
  document.querySelectorAll('.sheet').forEach(s=>s.classList.toggle('on',s.id===id));
  $('scrim').classList.toggle('on',!!id);
}
const rebuilt=id=>built.has(id);
$('scrim').onclick=()=>sheet(null);
/* ⚠️ The marker is on the CELL, so the CELL is what gets toggled. Toggling only the
   tile is how the badge ends up trapped under the tile's own clip — see the .tick
   note in the CSS. One helper, so the three grids cannot drift apart again. */
function markSel(root,sel,el){
  root.querySelectorAll(sel).forEach(p=>{
    const on=p===el;
    p.classList.toggle('on',on);
    const c=p.closest('.cell'); if(c)c.classList.toggle('on',on);
  });
}
/* ⚠️ Built on FIRST OPEN, not at boot. See buildEggGrid: 21 thumbnails is ~3MB, and
   it sat on the critical path of a screen that shows an egg and a Start button. */
$('plus').onclick=()=>sheet('shReminder');
document.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>
  sheet({egg:'shEgg',music:'shMusic',bg:'shBg'}[b.dataset.sheet]));

/* reminder icons — monoline, in the navy family. Illustrated set is an art pass. */
const GLYPH={
  youdidit:'<path d="M12 3.6v3.2M6.6 5.8l1.9 2.6M17.4 5.8l-1.9 2.6"/><path d="M5.2 20.4v-4.1a2 2 0 0 1 1.2-1.9l2.3-1a2 2 0 0 0 1.1-1.3l.5-1.9a1.5 1.5 0 0 1 2.9.4v2.7h3.6a2 2 0 0 1 2 2.4l-.8 3.6a2.2 2.2 0 0 1-2.1 1.7z"/>',
  goodjob:'<path d="M7 11.5v8.5H4.6a1.6 1.6 0 0 1-1.6-1.6v-5.3A1.6 1.6 0 0 1 4.6 11.5z"/><path d="M7 11.5 12.3 3a2.2 2.2 0 0 1 3.5 2.4L14.4 9.4h4.9a2 2 0 0 1 2 2.5l-1.6 6.4a2.4 2.4 0 0 1-2.3 1.7H7z"/>',
  hooray:'<circle cx="12" cy="12" r="9.3"/><path d="M8 10.4h.02M16 10.4h.02"/><path d="M7.6 14.2a5 5 0 0 0 8.8 0z"/>',
  love:'<path d="M12 20.4S3.4 15.3 3.4 9.3A4.6 4.6 0 0 1 12 6.9a4.6 4.6 0 0 1 8.6 2.4c0 6-8.6 11.1-8.6 11.1z"/>',
  shoes:'<path d="M3 16.6h12.4l4.6 1.8a2 2 0 0 1 1 1.7v.5H3z"/><path d="M3 16.6V8.2a1 1 0 0 1 1.5-.9L8 9.3l2.6-2 2.4 5.6"/>',
  socks:'<path d="M5.4 3h4.4v8.8l-3.2 4a2.6 2.6 0 1 0 4 3.3l3.3-4.1"/><path d="M14.2 3h4.4v9.2"/>',
  bath:'<path d="M3 12.4h18v2.2a4.6 4.6 0 0 1-4.6 4.6H7.6A4.6 4.6 0 0 1 3 14.6z"/><path d="M6.4 12.4V5.8a2.4 2.4 0 0 1 4.6-1M6 21l-1 1.6M18 21l1 1.6"/>',
  bed:'<path d="M12.6 2.6a7.4 7.4 0 1 0 8.8 8.8 7.6 7.6 0 0 1-8.8-8.8z"/><path d="M4.4 5.6h3.4L4.4 9h3.4"/>',
  tidy:'<path d="M4.4 8.6h15.2l-1.1 11a2 2 0 0 1-2 1.8H7.5a2 2 0 0 1-2-1.8z"/><path d="M3 8.6h18M9.4 8.6V5.4a1.6 1.6 0 0 1 1.6-1.6h2a1.6 1.6 0 0 1 1.6 1.6v3.2"/>',
  teeth:'<path d="M7 3.4c2 0 2.4 1.2 5 1.2s3-1.2 5-1.2a3 3 0 0 1 3 3.3c0 3.4-1.3 4.2-2 8.2-.5 3-1.1 5.5-2.6 5.5s-1.7-3.6-3.4-3.6-1.9 3.6-3.4 3.6-2.1-2.5-2.6-5.5c-.7-4-2-4.8-2-8.2A3 3 0 0 1 7 3.4z"/>',
  eat:'<path d="M6.4 3v7.4a2.4 2.4 0 0 0 4.8 0V3M8.8 10.4V21"/><path d="M17.2 21v-7.6a4 4 0 0 1-1.4-3.2V6.6a3.6 3.6 0 0 1 2.8-3.5V21z"/>',
  screenoff:'<rect x="2.6" y="4" width="18.8" height="13" rx="2.6"/><path d="M8 21h8M12 17v4"/><path d="M12 7.6v3.2M9.6 8.4a3.4 3.4 0 1 0 4.8 0"/>',
};
/* The drawn art wins wherever it exists, and the monoline glyph stands in where it
   does not — so the sheet is never a grid of broken images while a batch is still
   generating. `icons/index.json` is written by tools/cut_icons.py, which is the one
   list: the cut and the sheet cannot disagree about what got drawn. */
let ART=new Set();
function buildRemGrid(){
  $('remGrid').innerHTML=REMINDERS.map(([k,label])=>`
    <div class="cell ${S.reminder===k?'on':''}">
      <button class="pick ${S.reminder===k?'on':''}" data-rem="${k}">
      ${k==='off' ? '<span class="off">Off</span>'
        : ART.has(k) ? `<img src="icons/${k}.png?v=${VER}" alt="${label}" loading="lazy">`
        : `<svg width="60%" height="60%" viewBox="0 0 24 24" fill="none" stroke="#2C3149"
             stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">${GLYPH[k]||''}</svg>`}
    </button>${TICK}<div class="plabel">${label}</div></div>`).join('');
}
fetch('icons/index.json?v='+VER).then(r=>r.json())
  .then(j=>{ ART=new Set((j.icons||[]).map(i=>i.slug)); if(rebuilt('shReminder'))buildRemGrid(); paintPlus() })
  .catch(()=>{});
$('remGrid').onclick=e=>{ const b=e.target.closest('[data-rem]'); if(!b)return;
  S.reminder=b.dataset.rem; save();
  markSel($('remGrid'),'.pick',b);
  paintPlus();
  preview(SAY_SRC[S.reminder],false);   // hear who says it, and unlock it while a tap is live
};
// the drawn icons carry their own generous margin, so they can run to the rim
$('remGrid').classList.add('artgrid');

/* the bubble shows WHAT was chosen, not THAT something was */
function paintPlus(){
  const on=S.reminder!=='off' && ART.has(S.reminder);
  $('plus').classList.toggle('set',on);
  $('plusGlyph').style.display=on?'none':'';
  $('plusIcon').style.display=on?'':'none';
  if(on)$('plusIcon').setAttribute('href','icons/'+S.reminder+'.png?v='+VER);
}
paintPlus();

/* ---------- the kid's own characters ----------
   Andjroo, 2026-07-31: "the kid should be able to add as many characters as they
   want, and there should be a place to take a picture."
   ⚠️ THEIR OWN KEY, not S. A photo is orders of magnitude bigger than every setting
   put together, and localStorage fails by THROWING on quota — one photo too many
   inside `kidtimer2` and the write that also carries the timer, the background and
   the reminder is the one that fails. Split, so a full camera roll can never cost
   the parent their settings.
   ⚠️ 320px TALL, because that is the roster's own height (tools/cut_heroes.py) and
   the rig sizes a character by `eggH/artH`. Store a phone's 3024px photo and it
   would land in the shells a tenth of the size of every drawn one. */
const PLS=LS+'.photos';
const HERO_H=320;
let PHOTOS=[];
try{ PHOTOS=JSON.parse(localStorage.getItem(PLS)||'[]') }catch(e){ PHOTOS=[] }
const savePhotos=()=>{ try{ localStorage.setItem(PLS,JSON.stringify(PHOTOS)); return true }
                       catch(e){ console.warn('photo not saved: storage full'); return false } };

const CAMICON=`<svg width="46%" height="46%" viewBox="0 0 24 24" fill="none" stroke="#8C93A3"
   stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round">
   <path d="M3 8.4h3.1l1.5-2.4h8.8l1.5 2.4H21a1.4 1.4 0 0 1 1.4 1.4v8.4A1.4 1.4 0 0 1 21 20H3a1.4 1.4 0 0 1-1.4-1.4V9.8A1.4 1.4 0 0 1 3 8.4z"/>
   <circle cx="12" cy="13.8" r="3.7"/></svg>`;

/* ---------- MANY CHARACTERS, ONE OF THEM COMES OUT ----------
   Andjroo, 2026-07-31: "I want the kid to be able to select multiple characters, so
   that way it's randomized as well." So this grid is the only multi-select one in the
   app: the sheet's own sub-line already said "who CAN come out of the egg", which is a
   set, and it had been behaving like a single choice.

   ⚠️ THE SET CAN NEVER BE EMPTY. Nothing selected means nothing can hatch, and the
   failure would land at the end of a real countdown a child has waited out. Tapping
   the last remaining one is a no-op rather than a fifth thing to handle at Start.

   ⚠️ AND THE FALLBACK IS ALL OF THEM, NOT THE FIRST ONE. Andjroo, 2026-08-27: the sheet
   "starts with just the bear selected". It did — the floor below was `heroes[0]`, and
   because line ~910 materialises heroSet() into S.heroes as soon as the roster lands,
   that floor WAS the default every fresh tablet saved. So the one sheet whose whole
   idea is "who CAN come out" shipped with a set of one, and twenty-one drawn animals
   sat there greyed while the same bear hatched every run. The floor and the default
   are the same line, and both want the whole roster: nothing to curate before the
   surprise works, and a set that emptied by attrition refills with everything rather
   than with whichever animal happens to be cut first.
   ⚠️ DRAWN HEROES ONLY — a kid's photo is theirs to add, not something to switch on
   for them. The camera handler ticks a new photo itself. */
function heroSet(){
  const live=new Set([...heroes.map(h=>h.id), ...PHOTOS.map(p=>p.id)]);
  // an id can go away: a photo the storage dropped, or art removed from the roster
  let sel=(S.heroes||[]).filter(id=>live.has(id));
  if(!sel.length)sel=heroes.map(h=>h.id);
  return sel;
}
function buildEggGrid(){
  const sel=new Set(heroSet());
  /* ⚠️ THE SAME URL THE RIG USES, VERSION AND ALL. The rig loads its heroes with
     `?v=<rig build>`; this grid asked for the bare path, so the browser saw two
     resources per animal and fetched 5.1MB where 2.97MB exists — measured, 42
     requests for 21 files. A query string is part of the cache key. */
  const V=(RIG&&RIG.build)?'?v='+RIG.build:'';
  const all=[...heroes.map(h=>({id:h.id,name:h.name,src:'rive-kit/individual-pngs/'+h.id+'.png'+V,photo:false})),
             ...PHOTOS.map(p=>({id:p.id,name:p.name,src:p.src,photo:true}))];
  $('eggGrid').innerHTML=all.map(h=>`
    <div class="cell ${sel.has(h.id)?'on':''}">
      <button class="pick ${h.photo?'photopick ':''}${sel.has(h.id)?'on':''}" data-hero="${h.id}"
              role="checkbox" aria-checked="${sel.has(h.id)}">
      <img src="${h.src}" alt="${h.name}" loading="lazy">
    </button>${TICK}${h.photo?PHOTODEL:''}<div class="plabel">${h.name}</div></div>`).join('')
    + `<div class="cell"><button class="pick" data-shoot aria-label="take a picture">
         ${CAMICON}</button><div class="plabel">Take a photo</div></div>`;
  $('dotEgg').style.display=sel.size?'block':'none';
}
/* ---------- taking a photo BACK OFF the roster ----------
   Andjroo, 2026-08-03: "my kids like to snap a couple pictures and then delete them,
   snap a couple pictures and then delete them." Until now PHOTOS only ever grew. A
   photo could be unticked so it would not hatch, but it stayed on the sheet forever
   and it kept its share of the quota — and savePhotos() fails by THROWING at quota,
   which is caught and turns into a photo that silently refuses to be added. So a kid
   who snapped enough eventually could not add another and had no way to make room.

   TWO TAPS, no dialog. The snap/delete rhythm above is the whole point and a confirm
   in the middle of it is the thing being complained about; but a photo is gone for
   good, so one stray tap must not take it. First tap arms the cell, second deletes,
   and arming lapses after four seconds so a child who wandered off finds nothing live. */
const PHOTODEL='<button class="del" data-delphoto aria-label="delete this photo">'
  +'<svg width="13" height="13" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.4"'
  +' stroke-linecap="round"><path d="M1 1l10 10M11 1L1 11"/></svg></button>';
let armedPhoto=null, armTimer=null;
function disarmPhoto(){
  clearTimeout(armTimer);
  $('eggGrid').querySelectorAll('.cell.arming').forEach(c=>c.classList.remove('arming'));
  armedPhoto=null;
}
function deletePhoto(id){
  const i=PHOTOS.findIndex(p=>p.id===id); if(i<0)return;
  PHOTOS.splice(i,1); savePhotos();
  /* Drop it from the chosen set too. heroSet() already filters ids that no longer
     exist and falls back to the first drawn hero when that empties the set, so the
     "the set can never be empty" rule holds without a special case here — but it has
     to be SAVED, or the dead id comes back out of localStorage on the next boot. */
  S.heroes=heroSet(); save();
  buildEggGrid();
}
$('eggGrid').onclick=e=>{
  const del=e.target.closest('[data-delphoto]');
  if(del){
    const cell=del.closest('.cell'), id=cell.querySelector('[data-hero]').dataset.hero;
    if(armedPhoto!==id){ disarmPhoto(); armedPhoto=id; cell.classList.add('arming');
                         armTimer=setTimeout(disarmPhoto,4000); return }
    disarmPhoto(); deletePhoto(id); return;
  }
  disarmPhoto();
  if(e.target.closest('[data-shoot]')){ $('shoot').click(); return }
  const b=e.target.closest('[data-hero]'); if(!b)return;
  const id=b.dataset.hero, sel=heroSet(), i=sel.indexOf(id);
  if(i>=0){ if(sel.length===1)return; sel.splice(i,1) } else sel.push(id);
  S.heroes=sel; save();
  const on=sel.includes(id);
  b.classList.toggle('on',on); b.setAttribute('aria-checked',on);
  b.closest('.cell').classList.toggle('on',on);
  $('dotEgg').style.display=sel.length?'block':'none';
};
/* `capture` asks the phone for the camera and is ignored on a desktop, where the
   same input is a file picker — one control, both places, no branch. */
$('shoot').onchange=e=>{
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  const url=URL.createObjectURL(f), im=new Image();
  im.onload=()=>{
    const k=HERO_H/im.naturalHeight;
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.naturalWidth*k)); c.height=HERO_H;
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    const id='photo-'+PHOTOS.length+'-'+Math.round(performance.now());
    const src=c.toDataURL('image/png');
    PHOTOS.push({id,name:'Photo '+(PHOTOS.length+1),src});
    if(!savePhotos())PHOTOS.pop();
    else{
      /* ⚠️ Registered with the rig BEFORE it joins the set — heroSet() drops ids the
         rig has never heard of, so ticking it first would tick it and lose it. */
      const add=(RIG&&RIG.addHero)?RIG.addHero(id,'Photo '+PHOTOS.length,src)
                                  :Promise.resolve(false);
      // taken FROM this sheet, so it is in the mix. Untick it like any other tile.
      Promise.resolve(add).then(()=>{
        S.heroes=[...heroSet(),id]; save(); buildEggGrid();
      });
    }
  };
  im.onerror=()=>URL.revokeObjectURL(url);
  im.src=url;
  e.target.value='';
};

$('musicBody').innerHTML=`
  <div class="lane"><h3>While the timer runs</h3><div class="opts" id="laneDuring"></div></div>
  <div class="lane"><h3>When it ends</h3><div class="opts" id="laneEnd"></div></div>`;
function buildLane(id,list,key){
  $(id).innerHTML=list.map(([k,l])=>
    `<button class="opt ${S[key]===k?'on':''}" data-v="${k}">${l}</button>`).join('');
  $(id).onclick=e=>{ const b=e.target.closest('[data-v]'); if(!b)return;
    S[key]=b.dataset.v; save();
    $(id).querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o===b));
    $('dotMusic').style.display=(S.during!=='none')?'block':'none';
    /* ⚠️ THE TAP THAT CHOOSES IS THE TAP THAT PREVIEWS, and it is also the gesture that
       unlocks the clip on iOS. These files are made on demand rather than primed with the
       hatch set — twenty of them is ~750KB to play one — so this is the earliest moment
       a chosen one can legally be played. It replaces a "Coming soon" toast: the lists
       were named and silent for two sessions and the honest thing then was to say so.
       They are not silent now, and hearing it is the answer a toast was standing in for. */
    preview(key==='during'?BED_SRC[S.during]:END_SRC[S.end], key==='during');
  };
}
buildLane('laneDuring',DURING,'during'); buildLane('laneEnd',ENDING,'end');
$('dotMusic').style.display=(S.during!=='none')?'block':'none';

/* The grid is filled out to whole rows of four so the sheet already has the shape it
   will have once the art lands, rather than re-flowing under Andjroo when it does. */
const BGSLOTS=Math.max(12,Math.ceil(BGS.length/4)*4);
/* ⚠️ THE THIRD PICKER GRID, AND IT WAS THE ONE STILL BUILT AT BOOT.
   The reminder and character grids were moved behind LAZY when their tiles turned out
   to be fetched inside a closed sheet; this one was written earlier, straight into
   innerHTML, and was missed. It cost more than either of them: four full-bleed phone
   backgrounds, of which the kid is looking at exactly one. Measured at 1.6 Mbps the
   three unseen JPEGs (183KB) landed at 2.4s, 3.1s and 3.5s — AHEAD OF THE EGG'S OWN
   ART, which did not start arriving until 4.1s. `loading="lazy"` is no help: a sheet
   is only translated off-screen, so its images are in the viewport as far as the
   browser is concerned. */
function buildBgGrid(){
  $('bgGrid').innerHTML=BGS.map(([k,l])=>`
    <div class="cell"><button class="bgpick ${S.bg===k?'on':''}" data-bg="${k}">
      <img src="bg/${k}.jpg?v=${VER}" alt="${l}"></button><div class="plabel">${l}</div></div>`).join('')
    + Array.from({length:BGSLOTS-BGS.length},()=>
        `<div class="cell"><div class="bgslot"></div><div class="plabel">&nbsp;</div></div>`).join('');
}
$('bgGrid').onclick=e=>{ const b=e.target.closest('[data-bg]'); if(!b)return;
  S.bg=b.dataset.bg; save(); if(bgSrc(S.bg))$('bgImg').src=bgSrc(S.bg);
  $('bgGrid').querySelectorAll('.bgpick').forEach(p=>p.classList.toggle('on',p===b));
};
/* the first background is set the moment S is read, ~700 lines above — a screen the
   kid looks straight at cannot wait for the picker's own wiring to be built. */

/* ---------- review strip ---------- */
document.querySelectorAll('[data-pie]').forEach(b=>{
  b.classList.toggle('on',b.dataset.pie===S.pie);
  b.onclick=()=>{ S.pie=b.dataset.pie; S.pieXY=null; save();
    document.querySelectorAll('[data-pie]').forEach(o=>o.classList.toggle('on',o===b));
    layout(); };   // the clock's own size depends on which one this is
});
// rolls too — it is the button Andjroo presses to look at the hatch, and a review
// control that skipped the roll would show him the same egg and the same animal
$('dvHatch').onclick=()=>{ if(screen!=='run'){ rollPattern(); rollHero(); go('run'); RIG.go(3) }
                           else RIG.hatchNow() };
$('dvReset').onclick=()=>{ conf.clear(); RIG.reset(); hatched=false; paused=false; go('set') };

/* ---------- boot ---------- */
addEventListener('resize',layout);
syncStart(); layout();
// the columns land on the saved time once they have a measured row height
requestAnimationFrame(()=>{ $('colMin')._goto(S.min); $('colSec')._goto(S.sec); });
/* ⚠️ `conf` IS A GETTER, because the binding is replaced when confetti lands (see the
   import note). Spreading the value here would hand the harness the inert stub for
   ever and the pop would be untestable. `revealed` is exposed for the same reason the
   build is: it is the one thing about this load that cannot be seen in a screenshot. */
window.TIMER={build:BUILD, go, sheet, state:()=>({screen,S}),
              get conf(){ return conf }, get revealed(){ return revealed }};
</script>
</body>
</html>
