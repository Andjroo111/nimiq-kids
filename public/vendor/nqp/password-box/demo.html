<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nimiq PasswordBox</title>
<link rel="stylesheet" href="../../../../assets/css/legacy/nimiq-style.min.css">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="password-box.css">
<style>
    /* Stage: Keyguard mounts the PasswordBox in a card's .page-footer (padding 0.75rem),
       card max-width 52.5rem -> box width 51rem. Two states: filled + loading. */
    body { font-family: 'Mulish', sans-serif; margin: 0; padding: 32px; background: white; }
    .password-box-demo {
        width: 51rem; /* 408px */
        display: flex;
        flex-direction: column;
        gap: 3rem;
    }
</style>
</head>
<body>
<div class="password-box-demo">
    <!-- State 1: 8 characters entered -> input-eligible; masked dots, eye toggle,
         Unlock button raised in. Click the eye to reveal the password. -->
    <form class="password-box actionbox nq-light-blue-bg input-eligible">
        <div class="prompt nq-text-s">Enter your password</div>
        <div password-input class="password-input">
            <div class="input-container">
                <div class="input-wrapper">
                    <input class="nq-input password" type="password" placeholder="••••••••" autocomplete="current-password" value="hunter22">
                </div>
                <svg class="nq-icon eye-button" viewBox="0 0 24 24">
                    <g class="is-visible" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M18.9 6.95c1.59 1 3.03 2.21 4.3 3.6.74.82.74 2.07 0 2.9-2.56 2.81-6.79 5.8-11.04 5.8h-.3a11.26 11.26 0 0 1-4.31-.94L3.4 22.45a1 1 0 0 1-1.63-1.08l.01-.01.01-.01 19.5-19.5a.74.74 0 0 0 .18-.3l.02-.01a1 1 0 1 1 1.41 1.41l-4 4zm-5.59 9.35a4.58 4.58 0 0 0 3-3.03 4.3 4.3 0 0 0-.2-3.06.25.25 0 0 0-.4-.07l-5.57 5.56a.25.25 0 0 0 .07.4 4.3 4.3 0 0 0 3.1.2z"/><path d="M7.62 13.4a.24.24 0 0 0 .06-.24A4.32 4.32 0 0 1 7.5 12a4.5 4.5 0 0 1 5.66-4.33c.09.03.18 0 .24-.06l1.94-1.94a.25.25 0 0 0-.1-.42c-1.05-.34-2.14-.5-3.24-.5C7.7 4.69 3.4 7.7.81 10.55a2.15 2.15 0 0 0 0 2.9 21.21 21.21 0 0 0 3.43 3.03c.1.07.24.06.33-.03l3.05-3.05z"/></g>
                    <g class="not-visible" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 4.6c4.4-.06 8.79 3.01 11.43 5.92.75.84.75 2.11 0 2.95-2.61 2.88-6.94 5.93-11.28 5.93h-.31c-4.33 0-8.66-3.05-11.27-5.93a2.21 2.21 0 0 1 0-2.95C3.2 7.62 7.6 4.54 12 4.6zm0 2.8a4.6 4.6 0 1 0 0 9.2 4.6 4.6 0 0 0 0-9.2z"/><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></g>
                </svg>
            </div>
        </div>
        <button class="submit nq-button light-blue inverse" type="button">Unlock</button>
        <!-- Loading spinner SVG -->
        <svg height="48" width="54" color="inherit" class="loading-spinner"><g stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round">
            <path class="big-hex" d="M51.9,21.9L41.3,3.6c-0.8-1.3-2.2-2.1-3.7-2.1H16.4c-1.5,0-2.9,0.8-3.7,2.1L2.1,21.9c-0.8,1.3-0.8,2.9,0,4.2 l10.6,18.3c0.8,1.3,2.2,2.1,3.7,2.1h21.3c1.5,0,2.9-0.8,3.7-2.1l10.6-18.3C52.7,24.8,52.7,23.2,51.9,21.9z" opacity="0.4" stroke-dasharray="92.5 60"/>
            <path class="small-hex" d="M51.9,21.9L41.3,3.6c-0.8-1.3-2.2-2.1-3.7-2.1H16.4c-1.5,0-2.9,0.8-3.7,2.1L2.1,21.9c-0.8,1.3-0.8,2.9,0,4.2 l10.6,18.3c0.8,1.3,2.2,2.1,3.7,2.1h21.3c1.5,0,2.9-0.8,3.7-2.1l10.6-18.3C52.7,24.8,52.7,23.2,51.9,21.9z" stroke-dasharray="47.5 105"/>
        </g></svg>
    </form>

    <!-- State 2: unlocking — .loading hides everything but the hexagon spinner. -->
    <form class="password-box actionbox nq-light-blue-bg input-eligible loading">
        <div class="prompt nq-text-s">Enter your password</div>
        <div password-input class="password-input">
            <div class="input-container">
                <div class="input-wrapper">
                    <input class="nq-input password" type="password" placeholder="••••••••" autocomplete="current-password" value="hunter22">
                </div>
                <svg class="nq-icon eye-button" viewBox="0 0 24 24">
                    <g class="is-visible" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M18.9 6.95c1.59 1 3.03 2.21 4.3 3.6.74.82.74 2.07 0 2.9-2.56 2.81-6.79 5.8-11.04 5.8h-.3a11.26 11.26 0 0 1-4.31-.94L3.4 22.45a1 1 0 0 1-1.63-1.08l.01-.01.01-.01 19.5-19.5a.74.74 0 0 0 .18-.3l.02-.01a1 1 0 1 1 1.41 1.41l-4 4zm-5.59 9.35a4.58 4.58 0 0 0 3-3.03 4.3 4.3 0 0 0-.2-3.06.25.25 0 0 0-.4-.07l-5.57 5.56a.25.25 0 0 0 .07.4 4.3 4.3 0 0 0 3.1.2z"/><path d="M7.62 13.4a.24.24 0 0 0 .06-.24A4.32 4.32 0 0 1 7.5 12a4.5 4.5 0 0 1 5.66-4.33c.09.03.18 0 .24-.06l1.94-1.94a.25.25 0 0 0-.1-.42c-1.05-.34-2.14-.5-3.24-.5C7.7 4.69 3.4 7.7.81 10.55a2.15 2.15 0 0 0 0 2.9 21.21 21.21 0 0 0 3.43 3.03c.1.07.24.06.33-.03l3.05-3.05z"/></g>
                    <g class="not-visible" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 4.6c4.4-.06 8.79 3.01 11.43 5.92.75.84.75 2.11 0 2.95-2.61 2.88-6.94 5.93-11.28 5.93h-.31c-4.33 0-8.66-3.05-11.27-5.93a2.21 2.21 0 0 1 0-2.95C3.2 7.62 7.6 4.54 12 4.6zm0 2.8a4.6 4.6 0 1 0 0 9.2 4.6 4.6 0 0 0 0-9.2z"/><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></g>
                </svg>
            </div>
        </div>
        <button class="submit nq-button light-blue inverse" type="button">Unlock</button>
        <!-- Loading spinner SVG -->
        <svg height="48" width="54" color="inherit" class="loading-spinner"><g stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round">
            <path class="big-hex" d="M51.9,21.9L41.3,3.6c-0.8-1.3-2.2-2.1-3.7-2.1H16.4c-1.5,0-2.9,0.8-3.7,2.1L2.1,21.9c-0.8,1.3-0.8,2.9,0,4.2 l10.6,18.3c0.8,1.3,2.2,2.1,3.7,2.1h21.3c1.5,0,2.9-0.8,3.7-2.1l10.6-18.3C52.7,24.8,52.7,23.2,51.9,21.9z" opacity="0.4" stroke-dasharray="92.5 60"/>
            <path class="small-hex" d="M51.9,21.9L41.3,3.6c-0.8-1.3-2.2-2.1-3.7-2.1H16.4c-1.5,0-2.9,0.8-3.7,2.1L2.1,21.9c-0.8,1.3-0.8,2.9,0,4.2 l10.6,18.3c0.8,1.3,2.2,2.1,3.7,2.1h21.3c1.5,0,2.9-0.8,3.7-2.1l10.6-18.3C52.7,24.8,52.7,23.2,51.9,21.9z" stroke-dasharray="47.5 105"/>
        </g></svg>
    </form>
</div>

<script>
    // Eye toggle + eligibility gate for the interactive (non-loading) box, ported from
    // PasswordInput._changeVisibility() / _onInputChanged(). Initial state matches the
    // static markup, so the pixel verification is unaffected.
    document.querySelectorAll('.password-box:not(.loading)').forEach((box) => {
        const input = box.querySelector('input.password');
        const eyeButton = box.querySelector('.eye-button');
        const MIN_LENGTH = 8;

        eyeButton.addEventListener('click', () => {
            const becomeVisible = input.getAttribute('type') === 'password';
            input.setAttribute('type', becomeVisible ? 'text' : 'password');
            eyeButton.classList.toggle('visible', becomeVisible);
            input.focus();
        });

        input.addEventListener('input', () => {
            const passwordLength = [...input.value].length;
            box.classList.toggle('input-eligible', passwordLength >= MIN_LENGTH);
        });
    });
</script>
</body>
</html>
