<!-- duo-node: one step on a Duolingo path, as the Nimiq hexagon. Requires duo-button.css (the
     colour contract) + duo-node.css. State classes go on the wrapper; the button inside is the
     pressable face; the ring svg (groove + fluid) and the bubble are only read on is-active and
     is-waiting, so they can be left out elsewhere. Glyphs here are nimiq-icons (nq assets add
     icon:check icon:star icon:gift); a host puts its own art in the face as an <img>.
     Source: mechanics off duolingo.com live CSS 2026-09-13; hexagon = nimiq-ui rule 22; the tunnel =
     rive-lab examples/nimiq-kids-egg-plate; see meta.json. -->
<div class="duo-node is-done">
    <button class="duo-node-face" type="button" aria-label="Step 1, done">
        <svg viewBox="0 0 12 10" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11.082 1.111 5.022 8.89 1.363 5.687"/></svg>
    </button>
</div>
<div class="duo-node is-active" style="--duo-progress: 0.5">

    <span class="duo-node-bubble">Start</span>
    <button class="duo-node-face" type="button" aria-label="Step 2, your turn">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M5.886 10.22a.23.23 0 01.227 0l2.875 1.618a1.18 1.18 0 001.385-.153 1.16 1.16 0 00.292-1.339L9.54 7.751a.23.23 0 01.058-.264L11.64 5.67a1.16 1.16 0 00.277-1.272 1.14 1.14 0 00-1.08-.706H8.53a.23.23 0 01-.213-.14L7.076.677 7.063.65a1.195 1.195 0 00-2.14.026L3.68 3.551a.23.23 0 01-.213.14H1.16a1.135 1.135 0 00-1.077.7 1.17 1.17 0 00.294 1.292l2.027 1.804a.23.23 0 01.058.264l-1.13 2.598a1.16 1.16 0 00.29 1.34 1.18 1.18 0 001.391.152z"/></svg>
    </button>
</div>
