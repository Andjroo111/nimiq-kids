<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>The timer · nimiq.kids</title>
<!-- ⚠️ THE BUILD AND THE BACKGROUND ARE DECIDED HERE, BEFORE THE BODY EXISTS.
     The module below is deferred by definition — it cannot run until the whole
     document has parsed — and the background it picks is a 96KB JPEG the kid looks
     straight at. Discovered from the module it started at 318ms and did not finish
     until 1598ms at 1.6 Mbps: 0.48s of bytes taking 1.28s, because by the time it
     was asked for the pipe was already full of art. Asked for here it goes out with
     the first bytes of the page.
     ⚠️ ONE TOKEN, MINTED ONCE. A preload only helps if it carries the SAME `v` the
     module later puts on bgImg.src. A different one is two downloads, not none — so
     BUILD and VER are minted here and the module reads them back rather than
     deriving the same string twice and hoping. -->
<script>
  /* ⚠️ THE APP'S SERVER READS THE NEXT LINE WITH A REGEX, so its spelling is an
     interface: src/timer-build.ts scans this file for the BUILD declaration to mint
     the token every asset under /kid/timer/ is stamped and cached against. No spaces
     round the equals, single quotes, and it must be the FIRST such declaration in the
     file — the scan takes the first match, including one inside a comment. Get it
     wrong and the token becomes `undefined-<mtime>`: still unique, so nothing looks
     broken, and the stamp quietly stops naming a build. */
  const BUILD='tmr-a0865a';
  window.TIMER_BUILD = BUILD;
  window.TIMER_VER = new URLSearchParams(location.search).get('v') || BUILD;
  try {
    /* ⚠️ NO SCENES SHIP (2026-09-15): bg/ is empty while the backgrounds are redrawn, so
       there is nothing to preload. TIMER_BGS is the one list; the module reads it too. */
    window.TIMER_BGS = [];
    var bg = (JSON.parse(localStorage.getItem('kidtimer3') || '{}').bg) || '';
    if (!/^[a-z]+$/.test(bg)) bg = '';   // it is a stored value; it is not trusted
    if (window.TIMER_BGS.some(function (b) { return b[0] === bg; })) {
      var l = document.createElement('link');
      l.rel = 'preload'; l.as = 'image';
      l.href = 'bg/' + bg + '.jpg?v=' + encodeURIComponent(window.TIMER_VER);
      document.head.appendChild(l);
    }
  } catch (e) {}
</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --navy:#1F2348; --teal:#21BCA5; --red:#F2554B; --amber:#E9B213;
    --sky:#2BC4DE;                 /* the light blue the running controls are */
    --ink:#4A4F63;                 /* the countdown digits: softer than the outline */
    --grey:#D8DCE4;
    /* SF Pro Rounded wherever it exists, which on Andjroo's phone is everywhere.
       The reference's whole personality is a rounded face; system-ui is not one. */
    --font:ui-rounded,'SF Pro Rounded','Hiragino Maru Gothic ProN',Mulish,system-ui,sans-serif;
  }
  /* ⚠️ WHITE, NOT #0d1020. The dark used to be the desktop letterbox either side of
     the phone column, and on the family TABLET that is what the letterbox actually
     was: two navy bars down a 1024px screen (Andjroo, 2026-08-27: "the background
     doesn't fit the whole screen"). The background is full-bleed now — see #bgImg —
     so the only thing this paints is the RUN screen, where the scene has collapsed
     into the badge and everything around it is meant to be white. */
  html,body{height:100%;overflow:hidden;background:#fff}
  body{font-family:var(--font);color:var(--navy);-webkit-font-smoothing:antialiased}

  /* The controls' column. On a desktop or a tablet it is a 430px lane so the egg,
     the dial and Start stay a thumb apart instead of stretching across a 1024px
     screen, and every number layout() derives is a share of THIS box.
     ⚠️ TRANSPARENT, AND THE BACKGROUND IS NO LONGER INSIDE IT. It used to paint
     #fff and hold #bgImg, so the scene could never be wider than the lane and the
     tablet showed two navy bars. #bgImg and #conf are fixed to the VIEWPORT now
     (below); this box holds only what is meant to be column-width. The white the
     run screen needs comes from `body`. */
  #app{position:fixed;inset:0;margin:0 auto;max-width:430px;background:transparent;
       overflow:hidden;isolation:isolate;z-index:1}

  /* ---------- the scene: the background AND the egg, clipped as one ----------
     Andjroo, 2026-07-31: "on the main screen the background takes up the whole
     thing behind the egg. Once the start button is pressed then we see the little
     egg and that's where it's in the circle."
     So the badge is not a second element that appears — it is this same layer with
     its clip closed down onto a circle. The background does not cross-fade into a
     disc, it BECOMES one, and the egg rides the same move.
     ⚠️ The rig iframe lives here permanently and is never re-parented. Moving an
     iframe between parents RELOADS its document, which would restart the rig
     mid-run and lose the countdown. Everything is transform + clip-path.        */
  /* ⚠️ overflow:hidden as well as the clip. clip-path hides the iframe's ink but
     leaves its 720px box in the scroll extent, so the phone reports 41px of
     sideways overflow at the badge scale — invisible, and still real. */
  /* ⚠️ THE CLIP IS ON THE BACKGROUND, NOT ON THE SCENE. Andjroo, 2026-07-31: the
     shells "need to fall to the side where they're falling out of that circle."
     They could not: the rig lived inside the clipped layer, so anything it drew
     past the badge's edge was cut off by the same circle that makes the badge.
     Clipping `#bgImg` alone keeps the move exactly as it was — the background is
     still the thing that BECOMES the disc — while leaving the rig free to throw a
     shell past the rim. `#scene` keeps overflow:hidden, which is a different job:
     the 720px iframe's box would otherwise put 41px of sideways scroll on a phone. */
  #scene{position:absolute;inset:0;z-index:1;overflow:hidden}
  /* ⚠️ FIXED TO THE VIEWPORT, OUTSIDE #app, AND THE CLIP IS THEREFORE IN SCREEN
     COORDINATES. This is the whole of the tablet fix: the image is the screen, the
     controls are the column, and the two stopped being the same box. layout() adds
     the column's own gutter to --clipX so the disc still opens on the egg — on a
     phone that gutter is 0 and every number is the one it always was.
     ⚠️ z-index 0, under #app (1) and under #conf (2). #app isolates, so anything
     outside it is wholly above or wholly below it; the background is below. */
  #bgImg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:0;
         clip-path:circle(var(--clipR) at var(--clipX) var(--clipY));
         transition:clip-path .52s cubic-bezier(.4,0,.2,1)}
  /* ⚠️ SIZED, NOT SCALED. This used to be a 720x560 iframe with a CSS
     transform:scale() on it. Two things go wrong with that: the compositor is
     free to rasterise a transformed iframe as a layer at its layout resolution
     and then stretch it, and the rig inside cannot tell how big it is really
     being drawn — so it cannot pick its own canvas resolution. Giving the frame
     its true css size makes both problems disappear, and the rig measures
     itself. The set->run collapse animates the box instead of a transform. */
  #rigWrap{position:absolute;pointer-events:none;
           transition:left .52s cubic-bezier(.4,0,.2,1),top .52s cubic-bezier(.4,0,.2,1),
                      width .52s cubic-bezier(.4,0,.2,1),height .52s cubic-bezier(.4,0,.2,1)}
  #rig{width:100%;height:100%;border:0;display:block;background:transparent}
  /* the badge's own edge, drawn over the clip so the disc has a rim like the ref */
  #badgeRim{position:absolute;z-index:2;border-radius:50%;pointer-events:none;
            box-shadow:0 10px 30px rgba(31,35,72,.18);opacity:0;transition:opacity .4s}
  body.run #badgeRim,body.hatch #badgeRim{opacity:1}

  /* ---------- screens: a crossfade, never a slide ----------
     Andjroo: "they have things come up from the bottom EXCEPT for when it
     transitions to the actual screen of the egg, it just like fades in."
     Sheets rise. Screens fade. Those are the only two moves in here.            */
  .screen{position:absolute;inset:0;z-index:3;opacity:0;pointer-events:none;
          transition:opacity .42s ease}
  .screen.on{opacity:1;pointer-events:auto}

  /* ---------- set screen ---------- */
  /* the numbers, on the shell. The egg is BLANK here — Andjroo picked "the egg is
     faceless while you set it, the face arrives the moment Start is pressed." */
  #dial{position:absolute;z-index:4;pointer-events:none;text-align:center}
  #dialTitle{font-weight:800;color:var(--teal);letter-spacing:-.3px}
  /* ⚠️ inline-flex, not flex. #dial spans the page so the title can centre on it,
     and a block-level #cols inherits that full width — which the selection band,
     pinned left:0/right:0 inside it, then draws edge to edge across the phone
     instead of across the numbers. Shrink-wrapping the columns is what keeps the
     band inside the egg where it belongs. */
  #cols{display:inline-flex;align-items:flex-start;justify-content:center;position:relative;
        padding:0 16px}
  .colhead{font-weight:800;color:#9AA0B0;text-align:center}
  .colwrap{position:relative}
  /* ⚠️ A real scroll container, not a fake one. iOS momentum and scroll-snap do the
     feel for free; a pointer-driven list has to reimplement both and never matches. */
  .col{overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;
       pointer-events:auto;overscroll-behavior:contain;touch-action:pan-y}
  .col::-webkit-scrollbar{display:none}
  .col .n{display:grid;place-items:center;scroll-snap-align:center;font-weight:800;
          color:var(--navy);font-variant-numeric:tabular-nums;transition:opacity .12s linear}
  /* NO RED LINES. Andjroo, 2026-07-31: "I don't want to use red lines but they have
     like the darker color solid and then a faded version for the number below it."
     The selection is a soft band behind the row, and min/sec are told apart by the
     colon sitting in it rather than by two underlines. */
  #band{position:absolute;left:0;right:0;border-radius:14px;background:rgba(33,188,165,.22);
        box-shadow:inset 0 0 0 2px rgba(33,188,165,.30);pointer-events:none;z-index:-1}
  #colon{position:absolute;left:50%;transform:translate(-50%,-50%);font-weight:800;
         color:var(--navy);pointer-events:none}

  /* the + moved off the bottom of the egg. Andjroo: "we could have it up and to the
     right" — it is a speech bubble, because what it adds is something to say.
     ⚠️ ONE path, not a circle with a CSS tail stuck on it. The tail was a rotated,
     skewed square with two borders, and its corners never met the circle's edge —
     "a little jankety". A disc and a tail are one outlined shape, so they are one
     arc and two lines, and the stroke runs round the whole of it without a join to
     get wrong. */
  /* ⚠️ IT RIDES THE EGG INTO THE BADGE, so it animates on the same curve #rigWrap
     does. Andjroo, 2026-08-27: he set "thumbs up" / "shoes on", pressed Start, and it
     "just goes away automatically" — it did: the bubble lived inside #scSet, which
     fades out, so the run screen showed no sign of the thing he had chosen and (with
     the sound off) never said it either. It is a child of #app now and layoutRun()
     parks it on the badge's shoulder. */
  #plus{position:absolute;z-index:5;background:none;border:0;padding:0;cursor:pointer;
        filter:drop-shadow(0 4px 10px rgba(31,35,72,.26));
        transition:left .52s cubic-bezier(.4,0,.2,1),top .52s cubic-bezier(.4,0,.2,1),
                   width .52s cubic-bezier(.4,0,.2,1),height .52s cubic-bezier(.4,0,.2,1),
                   opacity .42s ease}
  /* Off the set screen it is a LABEL, not a control: nothing about a running
     countdown should be one tap from a modal sheet. And with no reminder chosen
     there is nothing to say, so the bare + does not follow the egg over. */
  body:not(.set) #plus{pointer-events:none}
  body:not(.set) #plus:not(.set){opacity:0}
  #plus svg{display:block;width:100%;height:100%;overflow:visible}
  /* Andjroo, 2026-07-31: setting a reminder must not recolour the bubble, it must
     put the reminder IN it. So the bubble goes white and becomes the same little
     white tile the icon is drawn for in the sheet — the choice is the state, and
     the colour stays out of it. */
  #plus .bub{fill:var(--teal)}
  #plus.set .bub{fill:#fff}

  .bigbtn{position:absolute;left:24px;right:24px;border:0;border-radius:22px;cursor:pointer;
          font-family:inherit;font-weight:800;color:#fff;letter-spacing:-.2px;padding:0}
  /* Start is the SAME teal as the selection band, the chosen tiles and the bubble.
     Andjroo, 2026-07-31 — the reference's green was a second accent doing nothing
     the teal was not already doing. One accent, used everywhere. */
  #start{background:var(--teal);box-shadow:0 0 0 6px #fff,0 8px 18px rgba(31,35,72,.20)}
  #start:active{transform:translateY(2px)}

  #tray{position:absolute;left:0;right:0;display:flex;justify-content:center;z-index:4}
  .trayb{background:#fff;border:0;border-radius:50%;display:grid;place-items:center;
         cursor:pointer;box-shadow:0 3px 10px rgba(31,35,72,.22);padding:0;position:relative}
  .trayb .dot{position:absolute;right:2px;bottom:2px;width:14px;height:14px;border-radius:50%;
              background:var(--teal);border:2.5px solid #fff}

  /* ---------- run + hatch ---------- */
  #mutes{position:absolute;right:14px;z-index:6;display:flex;gap:6px;
         top:calc(env(safe-area-inset-top,0px) + 12px)}
  body.set #mutes{display:none}
  .mute{background:none;border:0;cursor:pointer;padding:4px;display:grid;place-items:center}

  #clockRow{position:absolute;left:0;right:0;z-index:4;display:flex;align-items:center;
            justify-content:center;gap:14px}
  #clock{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .step{border:0;border-radius:50%;background:var(--grey);color:#fff;cursor:pointer;
        display:grid;place-items:center;padding:0;flex:none}
  .step:active{background:#c3c8d2}

  #runCtl{position:absolute;left:0;right:0;z-index:4;display:flex;justify-content:center;gap:18px}
  /* Andjroo, 2026-07-31: pause, stop and done all want a shadow underneath. It is a
     LEDGE, not a blur — a grey slab sitting a little proud of the button on every
     side, the way the reference's buttons sit on the page. Pressing shortens it
     rather than removing it, so the button travels down onto its own shadow. */
  .ctl,#done,#btnJobDone{box-shadow:0 9px 0 2px #D6DBE4, 0 15px 20px rgba(31,35,72,.14)}
  .ctl:active,#done:active,#btnJobDone:active{transform:translateY(5px);
       box-shadow:0 4px 0 2px #D6DBE4, 0 8px 12px rgba(31,35,72,.12)}
  .ctl{background:var(--sky);border:0;border-radius:20px;cursor:pointer;display:grid;
       place-items:center;padding:0}
  #done{background:var(--red)}
  /* the run screen's primary action, wearing the hatch Done's ledge in the accent
     Start already uses — same slot, same shape, different job. */
  #btnJobDone{background:var(--teal)}
  /* ---------- JOB MODE: the card above the egg ----------
     Transcribed from public/vendor/nqp/tooltip/tooltip.css at ITS rem scale (8px):
       padding 1.5rem -> 12px · radius .5rem -> 4px · font-size 1.75rem -> 14px
       shadow 0 1.125rem 2.275rem -> 0 9px 18.2px · arrow 2.25x2rem -> 18x16px
     --nimiq-blue is #1F2348, which is already this file's --navy. */
  /* ⚠️ A BAND, NOT A POINT — top AND bottom, with the content sitting at the bottom of
     it. The card hangs off the egg (bottom) but must never climb into the host's back
     chevron (top), and the chevron's position depends on `env(safe-area-inset-top)`,
     which is 0 in every headless render and ~47px on Andjroo's phone. Anchoring only
     the bottom and letting the card grow upward is therefore a bug that CANNOT be seen
     in a screenshot here: on a notched phone a two-line job would grow straight under
     the chevron. Bounding the box in CSS lets env() do the arithmetic; justify-content
     keeps a short card hugging the egg instead of floating in the middle of the band. */
  #jobCard{position:absolute;left:0;right:0;z-index:5;pointer-events:none;
           display:flex;flex-direction:column;align-items:center;
           top:calc(env(safe-area-inset-top, 0px) + 66px)}
  /* ⚠️ margin-top:auto, NOT justify-content:flex-end — they agree while the content
     fits and disagree in exactly the case this band exists for. flex-end overflows past
     the START edge, so a card too tall for the band grows UP through the chevron, which
     is the one thing the floor was added to prevent (measured: 2.4px through a 113px
     floor, and far worse for two lines). An auto margin resolves to 0 when there is no
     spare space, so the card pins to the top of the band and overflows DOWNWARD instead
     — onto the egg, which is art, rather than onto the back button, which is a tap
     target. Same result whenever it fits, which is every phone without a notch. */
  #jobCardBox{margin-top:auto}
  /* ⚠️ WIDTH IS NOT WHAT KEEPS THIS OFF THE HOST'S BACK CHEVRON — HEIGHT IS.
     The chevron occupies a band at the very top (app draws it at safe-area + 14px, 44
     tall, so y 14..58). The card is anchored to the egg and grows UPWARD, so the only
     way it reaches the chevron is by getting TALL. Narrowing it is exactly the wrong
     lever: a narrower card wraps to more lines, gets taller, and climbs further into
     the thing the narrowing was meant to avoid.
     So it is wide enough for a four-word job to stay on ONE line, which is both what
     Andjroo asked for and what keeps the card shortest. The two-line clamp on #jobName
     is the real guarantee: it bounds the height, and a bounded height cannot reach the
     band. Verified at 390 and 360 — see tools/eggtimer-jobflow.py, which asserts the
     card clears both the egg and the chevron. */
  #jobCardBox{max-width:calc(100% - 44px);display:flex;align-items:center;gap:10px;
      padding:12px 14px;border-radius:4px;color:#fff;
      background:radial-gradient(100% 100% at bottom right, #260133, var(--navy));
      box-shadow:0 9px 18.2px rgba(0,0,0,.11)}
  /* The job's REAL icon, the same asset the chart card and the done sheet draw.
     ⚠️ Hidden by its own onerror rather than left as a broken-image glyph — the app
     falls back to the emoji when it has no icon, and so must this. */
  #jobIcon{width:30px;height:30px;object-fit:contain;flex:none}
  #jobEmoji{font-size:24px;line-height:1;flex:none}
  #jobCardText{min-width:0}
  /* Two lines at most, so the card's height is bounded and it cannot climb into the
     host's back chevron however long a parent names a job. */
  #jobName{font-weight:700;font-size:14px;line-height:1.3;letter-spacing:-.1px;
           overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;
           -webkit-box-orient:vertical;overflow:hidden}
  /* the length the parent set. Tabular, like every other number on this screen. */
  #jobTime{font-weight:700;font-size:14px;line-height:1.3;opacity:.65;
           font-variant-numeric:tabular-nums}
  /* the triangle, masked out of the component's own SVG so it is the same shape at
     the same 18x16, and filled with the gradient colour where it meets the box. */
  #jobArrow{display:block;width:18px;height:16px;background:#23123e;
      mask-image:url('data:image/svg+xml,<svg viewBox="0 0 18 16" xmlns="http://www.w3.org/2000/svg"><path d="M9 7.12c-.47 0-.93.2-1.23.64L3.2 14.29A4 4 0 0 1 0 16h18a4 4 0 0 1-3.2-1.7l-4.57-6.54c-.3-.43-.76-.64-1.23-.64z" fill="white"/></svg>');
      -webkit-mask-image:url('data:image/svg+xml,<svg viewBox="0 0 18 16" xmlns="http://www.w3.org/2000/svg"><path d="M9 7.12c-.47 0-.93.2-1.23.64L3.2 14.29A4 4 0 0 1 0 16h18a4 4 0 0 1-3.2-1.7l-4.57-6.54c-.3-.43-.76-.64-1.23-.64z" fill="white"/></svg>');
      /* ⚠️ mask-size MUST be stated. The component's triangle SVG carries a viewBox and
         no width/height, so it has no intrinsic size, and the default `mask-size:auto`
         resolves that to nothing — the element is the right 18x16 with the right fill
         and is masked out completely. Invisible, with every property looking correct. */
      mask-size:100% 100%;-webkit-mask-size:100% 100%;
      mask-repeat:no-repeat;-webkit-mask-repeat:no-repeat;
      transform:scaleY(-1)}
  /* `hidden` loses to any display rule, and #cols and #dialTitle both carry one. */
  [hidden]{display:none!important}

  /* the pie. Ours is deliberately NOT where theirs is — Andjroo, 2026-07-31.
     Three placements are live so he can pick one, and it drags anywhere.
     ⚠️ "Beside the clock" cannot be an absolute overlay: at 390px a 112px disc
     parked on the left of a centred row lands straight on top of the + stepper AND
     the leading digit. Beside means IN the row — so the pie is re-parented into it
     and flexbox does the spacing, rather than three numbers being kept in sync. */
  #pie{z-index:5;cursor:grab;touch-action:none;flex:none;
       filter:drop-shadow(0 3px 8px rgba(31,35,72,.22))}
  #pie.free{position:absolute}
  #pie.dragging{cursor:grabbing}
  #pieHost{position:absolute;inset:0;z-index:5;pointer-events:none}
  #pieHost>*{pointer-events:auto}
  body.set #pieHost,body.hatch #pieHost,body.set #rimArc,body.hatch #rimArc{display:none}
  #rimArc{position:absolute;z-index:5;pointer-events:none}

  /* ⚠️ THE WHOLE SCREEN. Andjroo, 2026-07-31: "the confetti needs to be happening
     across the entire screen, not just inside of the circle." It was a canvas the
     size of the badge with a 50% radius on it, so every piece was born inside the
     disc and clipped at its edge — the burst could not travel. Full bleed, no
     radius, and confetti.js sizes its field off the canvas it is handed. */
  /* ⚠️ AND IT IS FIXED TO THE VIEWPORT TOO, for the same reason the background is:
     inside a 430px column on a tablet, "across the entire screen" was across the
     middle third of it. burstPops() already scales the pop count by the canvas AREA,
     so widening the field raises the count on its own. */
  #conf{position:fixed;inset:0;z-index:2;pointer-events:none}

  /* ---------- sheets: these are the things that come up from the bottom ----------
     ⚠️ THE OVERLAY IS THE SCREEN AND THE LANE IS THE COLUMN. #app is a 430px column;
     a scrim inside it dimmed only the column, which on a tablet reads as a lit
     background with one dark stripe down the middle of it. So the scrim, the four
     sheets and the toast sit out here, above #app (1) and #conf (2), and #sheetCol
     puts the column back around the sheets alone — which is why every .sheet rule
     below is untouched and still measures from `left:0;right:0`.
     ⚠️ pointer-events:none on the way in. This layer covers the whole screen at all
     times; without it the dial, Start and the dock are dead the moment it exists.
     The scrim takes its own taps back when it is on, and a sheet always takes its. */
  #overlay{position:fixed;inset:0;z-index:3;pointer-events:none}
  #sheetCol{position:absolute;inset:0;margin:0 auto;max-width:430px}
  #scrim{position:absolute;inset:0;z-index:8;background:rgba(31,35,72,.34);opacity:0;
         pointer-events:none;transition:opacity .3s}
  #scrim.on{opacity:1;pointer-events:auto}
  /* ⚠️ min-height, not just content. Andjroo, 2026-07-31, on the backgrounds sheet:
     "the card should slide up a little bit more." A one-row sheet is 250px tall and
     stops well short of the ones beside it, so the same gesture lands in a different
     place depending on which button opened it. The floor is what makes them agree. */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;background:#F3F5F8;
         pointer-events:auto;
         border-radius:22px 22px 0 0;transform:translateY(100%);
         transition:transform .38s cubic-bezier(.32,.72,0,1);
         min-height:46%;max-height:88%;display:flex;flex-direction:column;
         padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
  .sheet.on{transform:translateY(0)}
  /* ---------- THE SHEETS ARE CENTRED, AND THE ✕ IS TOP RIGHT ----------
     Andjroo, 2026-07-31: "who came out of the egg is not centered, it should be
     centered" and then "taking back my notes... seems like everything is to the
     left." Both readings were of the same thing: the header was centred while the
     ✕ and the sub-line were left, so the sheet never committed either way.
     Settled by the nimiq-ui skill rather than by taste — Nimiq's own bottom sheets
     (references/screenshots/wallet-app/logged-in/receive-nim-address-qr-mobile.png,
     send-transaction-enter-address-mobile.png) put the title CENTRED, the section
     labels CENTRED, and the close button as a CIRCLED X pinned to the TOP RIGHT.
     The left slot is the back arrow's, and these sheets have no back. */
  .shead{padding:16px 56px 6px}
  .shead h2{text-align:center;font-size:19px;font-weight:800;text-wrap:balance}
  /* ⚠️ NOT the ✕ character. Andjroo: "the ✕ is far too small and not correct." A
     text glyph is whatever weight and size the font feels like — at 19px it came
     out a hairline cross about 11px across, with no tap target under it. This is
     the registry's close-button (`nq info close-button`): the @nimiq/style close
     icon, which is a filled disc with the X knocked out of it, carried at 20%
     opacity and 40% on press. Drawn, so it is the same mark at every size. */
  .sclose{position:absolute;top:12px;right:12px;z-index:3;width:44px;height:44px;
          background:none;border:0;padding:0;cursor:pointer;color:var(--navy);
          display:grid;place-items:center}
  .sclose svg{display:block;opacity:.2;transition:opacity .3s cubic-bezier(.25,0,0,1)}
  .sclose:hover svg,.sclose:active svg{opacity:.4}
  .ssub{padding:2px 22px 12px;font-size:16px;color:#8C93A3;font-weight:600;
        line-height:1.3;text-align:center;text-wrap:balance}
  .sbody{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  /* ⚠️ width:100% is load-bearing. A <button> keeps intrinsic sizing, so with only
     aspect-ratio to go on the "Off" tile — whose content is a 27px word rather than
     a percentage-sized SVG — shrink-wrapped to 37px while every other tile came out
     110px. One definite dimension and the ratio does the rest. */
  /* ---------- THE SELECTED MARKER HANGS OFF THE CELL, NOT INSIDE THE TILE ----------
     ⚠️ ONE BUG, TWO REPORTS. Andjroo read the character sheet's badge as "inside the
     bubble... it is on the wrong item, an indexing bug" and the reminder sheet's as
     "the check is BELOW instead of above". Indexing is fine — tapping item 9 selects
     item 9, proved with real pointer events. The marker was a `:after` on `.pick`,
     pinned to hang off the corner at right/bottom -2px, and `.pick` carries
     `overflow:hidden` so the img cannot poke past the circle. A clip does not care
     what it was hung on: the badge got dragged back INSIDE the tile, where the
     circular clip parks it low over the artwork. On the 82px character tile that is
     on top of the animal; on the 110px reminder tile it is under the icon.
     So the marker belongs to the CELL, which has nothing clipping it, and it goes
     to the TOP right — clear of the label underneath, and the corner nimiq-ui puts
     a marker in. Not a ✓ glyph either: drawn, for the same reason as the ✕. */
  .cell{position:relative}
  .pick{width:100%;aspect-ratio:1;border-radius:50%;background:#fff;border:5px solid #E3E7EE;
        cursor:pointer;display:grid;place-items:center;position:relative;padding:0;overflow:hidden}
  .pick.on{border-color:var(--teal)}
  .tick{position:absolute;top:-5px;right:-5px;width:32px;height:32px;border-radius:50%;
        background:var(--teal);border:3px solid #F3F5F8;z-index:2;pointer-events:none;
        display:none;place-items:center}
  .cell.on .tick{display:grid}
  .grid4 .tick{width:27px;height:27px;top:-4px;right:-4px;border-width:2.5px}
  /* Delete, on a kid's own photo only. TOP-LEFT because .tick owns top-right, and on
     the CELL for the same reason the tick is: .pick clips to its circle, so a badge
     hung on the button gets dragged back inside and parks over the face. */
  .del{position:absolute;top:-5px;left:-5px;width:30px;height:30px;border-radius:50%;
       background:#8C93A3;border:3px solid #F3F5F8;z-index:3;padding:0;cursor:pointer;
       display:grid;place-items:center;transition:background 120ms,transform 120ms}
  .grid4 .del{width:26px;height:26px;top:-4px;left:-4px;border-width:2.5px}
  /* Armed: the photo steps back and the badge goes red, so "one more tap ends this"
     reads without words to a child who cannot yet read the label. */
  .cell.arming .pick{opacity:.4}
  .cell.arming .del{background:var(--red);transform:scale(1.15)}
  .pick img{width:82%;height:82%;object-fit:contain}
  .artgrid .pick img{width:88%;height:88%}
  .photopick img{width:100%;height:100%;object-fit:cover}
  .pick .off{font-size:19px;font-weight:800;color:#8C93A3}
  .plabel{text-align:center;font-size:11.5px;font-weight:700;color:#8C93A3;margin-top:4px;
          text-transform:capitalize}
  .bgpick{aspect-ratio:1;border-radius:18px;overflow:hidden;border:4px solid #E3E7EE;padding:0;
          cursor:pointer;display:block;width:100%}
  .bgpick.on{border-color:var(--teal)}
  .bgpick img{width:100%;height:100%;object-fit:cover;display:block}
  /* Andjroo: "more backgrounds are coming, so add more spaces." An empty slot is the
     honest way to say that — it holds the grid's shape now and it is where the next
     one lands, rather than the row re-flowing under him when the art arrives. */
  .bgslot{aspect-ratio:1;border-radius:18px;border:4px dashed #DDE1E9;background:#EDF0F5}
  .lane{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:12px}
  /* the same short grey uppercase section label nimiq.com and the wallet both use
     ("ENTER ADDRESS", "TOTAL BALANCE") — and they centre it, so this centres too */
  .lane h3{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;
           color:#8C93A3;margin-bottom:9px;text-align:center}
  /* ⚠️ A GRID, NOT WRAPPED FLEX. Andjroo, 2026-07-31: "reorganize the sound one so
     they're uniform." Every pill was its own width — "Bell" against "Kids cheer" —
     and a centred wrap then re-centred each ragged row, so no two rows started or
     ended in the same place and nothing lined up with anything. Equal columns make
     every pill the same size and put every row on the same two edges.
     Two columns, not three: at 360px three leaves ~95px a cell and "Kids cheer"
     needs ~106px, so the widest label is exactly the one that would have broken it. */
  .opts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
  .opt{border:0;background:#EEF1F6;border-radius:500px;padding:11px 10px;font-family:inherit;
       font-size:14.5px;font-weight:800;color:var(--navy);cursor:pointer;text-align:center;
       width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .opt.on{background:var(--teal);color:#fff}

  /* ---------- the toast ----------
     Andjroo, 2026-07-31: "a toast notification to say coming soon, because I'm not
     going to get to that today." The sound lists are named and silent, so choosing
     one has to say so rather than look broken.
     ⚠️ It RISES, like everything else that is not a screen change (his rule: things
     come up from the bottom, except the move to the egg screen, which fades).
     ⚠️ AND IT PARKS ABOVE THE OPEN SHEET, measured off that sheet rather than set to
     a number. A toast pinned to the bottom of the phone is behind the sheet that
     raised it; one dropped in the middle covers the options being chosen from.
     Navy with the brand's bottom-right radial, never a flat fill. */
  #toast{position:absolute;left:50%;z-index:11;max-width:calc(100% - 36px);
         transform:translate(-50%,14px);opacity:0;pointer-events:none;
         background-color:var(--navy);
         background-image:radial-gradient(100% 100% at bottom right,#260133,#1F2348);
         color:#fff;font-weight:800;font-size:15px;letter-spacing:-.1px;
         padding:13px 22px;border-radius:500px;white-space:nowrap;
         box-shadow:0 10px 26px rgba(31,35,72,.30);
         transition:opacity .26s cubic-bezier(.25,0,0,1),
                    transform .26s cubic-bezier(.25,0,0,1)}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- NOTHING IS SEEN UNTIL IT HAS BEEN LAID OUT, AND UNTIL IT IS WHOLE ----
     Andjroo, 2026-08-01: "there is a weird little pop up where it looks like there's
     almost a list of things", and then "it kind of does it in different parts rather
     than all being loaded at once."

     Both are this one cover. EVERY dimension on the set screen comes from layout() —
     the dial's position, the column height, the bubble, Start, the tray — and none of
     them has a CSS size to fall back on, so a paint that beats layout() shows the
     minute column at its natural 1440px: sixty numbers running down the phone. That
     is the list he saw. It was one network round trip wide (see the confetti note in
     the module), which is why it never got longer on a faster connection and never
     went away on a slower one.

     A cover in the MARKUP, not a class toggled by script, because the thing being
     guarded against is script not having run yet. It is opaque from the first paint
     for free, and it is what the fade at the end of the load fades OUT — so the
     background, the chrome and the egg stop being three arrivals and become one.
     ⚠️ IT MUST NOT BE ABLE TO STICK. reveal() is armed on a timer before anything
     that could throw (see boot), so a broken load shows a broken timer rather than a
     white rectangle. */
  #preboot{position:fixed;inset:0;z-index:99;background:#fff;pointer-events:none;
           transition:opacity .34s ease}
  #preboot.gone{opacity:0}

  /* ---------- the review strip. ?clean=1 removes it for captures. ---------- */
  #dev{position:fixed;left:0;right:0;bottom:0;z-index:12;background:rgba(31,35,72,.90);
       color:#fff;display:flex;align-items:center;gap:6px;padding:6px 8px;overflow-x:auto;
       font-size:11px;font-weight:800}
  #dev.off{display:none}
  #dev b{opacity:.55;font-weight:800;text-transform:uppercase;letter-spacing:.4px;flex:none}
  #dev button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:500px;
              padding:5px 10px;font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;flex:none}
  #dev button.on{background:var(--teal)}

</style>
</head>
<body class="set">

<!-- ⚠️ THE BACKGROUND AND THE CONFETTI ARE OUTSIDE #app ON PURPOSE, and it is the
     tablet that made them move. #app is a 430px column; while these lived inside it
     the scene could not be wider than the column, so a 1024px screen showed the
     picture down the middle with two navy bars either side. Fixed to the viewport
     they are the whole screen, and #app keeps only what is meant to be a column.
     ⚠️ THE CLIP STILL BELONGS TO THE BACKGROUND (see the #scene note below): the
     background BECOMES the badge. What changed is the coordinate space it is clipped
     in, which layout() now converts for. -->
<img id="bgImg" alt="" />
<canvas id="conf"></canvas>

<div id="app">

  <!-- the egg. The background used to be in here with it, clipped as one thing;
       the clip is still the background's, one level up. -->
  <div id="scene">
    <!-- ⚠️ the version is load-bearing. Without it Safari happily reuses a cached
         wiggle.html forever, so the page reloads and the RIG does not — which is
         exactly how three rounds of fixes can look identical on a phone. -->
    <div id="rigWrap"><iframe id="rig" scrolling="no" title="egg"></iframe></div>
  </div>
  <div id="badgeRim"></div>

  <!-- ⚠️ NOT INSIDE A SCREEN. It is the same bubble on the set screen and on the run
       screen — placed by layoutSet() at the egg's shoulder and by layoutRun() at the
       badge's, so it travels with the egg instead of fading out with #scSet. -->
  <button id="plus" aria-label="add a reminder">
    <!-- disc r32 at (50,44); the tail hangs off the arc between 105° and 160°.
         large-arc=1 sweep=0 takes the 305° way round, i.e. everywhere the tail
         is not, so the outline closes through the tip in one stroke. -->
    <svg viewBox="0 0 100 100">
      <clipPath id="discClip"><circle cx="50" cy="44" r="29.3"/></clipPath>
      <path class="bub" d="M41.72 74.91 A32 32 0 1 0 19.93 54.94 L16.4 80.6 Z"
            stroke="#3E4358" stroke-width="5.4" stroke-linejoin="round"/>
      <path id="plusGlyph" d="M50 30v28M36 44h28" fill="none" stroke="#fff"
            stroke-width="7.6" stroke-linecap="round"/>
      <!-- The chosen reminder rides inside the disc, centred on (50,44).
           ⚠️ The TALLEST icon sets this box, not the average one. Sized by ink
           area, a toothbrush fills its 256 box top to bottom while a heart fills
           about two thirds of it — so a box tuned to make the heart look right
           pushes the brush's tip and handle straight through the navy outline.
           56 keeps the worst case inside r29.3, and the clip is the guarantee. -->
      <image id="plusIcon" x="22" y="16" width="56" height="56"
             clip-path="url(#discClip)" style="display:none"/>
    </svg>
  </button>

  <!-- ================= SET ================= -->
  <section class="screen on" id="scSet">
    <!-- the gear went 2026-07-31 on Andjroo's call: "we can get rid of the gear icon
         in the top left, I think that's good with not having that for right now."
         (He had raised and retracted this once before; this is the decision.) -->

    <div id="dial">
      <div id="dialTitle">Set Timer</div>
      <div id="cols">
        <div id="band"></div>
        <div class="colwrap"><div class="colhead" id="hMin">Min</div><div class="col" id="colMin"></div></div>
        <div class="colwrap"><div class="colhead" id="hSec">Sec</div><div class="col" id="colSec"></div></div>
        <div id="colon">:</div>
      </div>
    </div>

    <!-- ================= JOB MODE: the job, said ABOVE the egg =================
         Andjroo, 2026-08-01: the title and icon sat ON the egg and "just doesn't look
         very well positioned"; the icon was the raw emoji glyph where every other
         surface in the app draws the job's real icon asset. All three facts — icon,
         name, and the length the PARENT set — move off the shell and into a card in
         the space above it, and the egg gets its face back.

         ⚠️ THE CARD IS THE VENDORED NIMIQ TOOLTIP, not a lookalike. Same masked
         triangle SVG, same radius, padding, shadow and blue-bg gradient as
         public/vendor/nqp/tooltip/tooltip.css, which is what the copy-address toast
         and the roadmap page already use. This file cannot LINK it — it is a
         standalone document with its own stylesheet and no nimiq-style — so the values
         are transcribed, and transcribed at the right scale: nimiq-style sets
         `html{font-size:8px}`, so its 1.5rem padding is 12px here, not 24px. -->
    <div id="jobCard" hidden>
      <div id="jobCardBox">
        <img id="jobIcon" alt="" draggable="false" hidden />
        <span id="jobEmoji" hidden></span>
        <div id="jobCardText">
          <div id="jobName"></div>

      <i id="jobArrow"></i>

    <button class="bigbtn" id="start">Start</button>

    <div id="tray">
      <!-- ⚠️ THE EGG IN THIS GLYPH IS OUR EGG, DRAWN FROM egg-outline.json.
           Andjroo, 2026-07-31: "the egg shape does not match ours." It did not: it was
           a hand-authored bezier that happened to be egg-ish, so the button that opens
           the egg sheet showed a different egg from the one on the screen behind it.
           Both paths are replaced at boot from the same curve the rig clips its shell
           to, so a recut of the art moves this icon with it. The `d`s below are only
           the fallback if the fetch fails. -->
      <button class="trayb" data-sheet="egg" aria-label="hatch surprises">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2C3149" stroke-width="1.9"
             stroke-linejoin="round" stroke-linecap="round">
          <path id="glyphEgg" d="M12 2.4c3.6 0 6.4 5.2 6.4 10.1A6.4 6.4 0 0 1 12 21.6a6.4 6.4 0 0 1-6.4-9.1C5.6 7.6 8.4 2.4 12 2.4z"/>
          <path id="glyphCrack" d="M6.2 13.4l2.6-1.7 2.5 1.7 2.5-1.7 2.5 1.7"/>
        </svg>
        <i class="dot" id="dotEgg" style="display:none"></i>
      </button>
      <button class="trayb" data-sheet="music" aria-label="sounds">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#2C3149">
          <path d="M20 3.6 8.6 6v9.2a3.4 3.4 0 1 0 1.8 3V9.1l7.8-1.6v5.3a3.4 3.4 0 1 0 1.8 3z"/>
        </svg>
        <i class="dot" id="dotMusic" style="display:none"></i>
      </button>
      <button class="trayb" data-sheet="bg" aria-label="background">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2C3149" stroke-width="1.9"
             stroke-linejoin="round">
          <rect x="2.6" y="4.6" width="18.8" height="14.8" rx="3.2"/>
          <circle cx="8.4" cy="10" r="1.7" fill="#2C3149" stroke="none"/>
          <path d="M3.4 16.6l4.5-4a2 2 0 0 1 2.7 0l3 2.7 2-1.7a2 2 0 0 1 2.6 0l2.4 2.1"/>
        </svg>
      </button>
    </div>
  </section>

  <!-- the two mute icons live OUTSIDE the screens: the reference carries them
       through the hatch too, and they are the same two controls either way -->
  <div id="mutes">
    <button class="mute" id="mMusic" aria-label="music"></button>
    <button class="mute" id="mBell" aria-label="end sound"></button>
  </div>
  <div id="pieHost">
    <svg id="pie" width="120" height="120" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="52" fill="#fff" stroke="#4A4F63" stroke-width="7"/>
      <path id="pieWedge" fill="var(--red)"></path>
      <line id="pieHand" x1="60" y1="60" x2="60" y2="12" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
      <circle cx="60" cy="60" r="52" fill="none" stroke="#4A4F63" stroke-width="7"/>
    </svg>
    <svg id="rimArc"><circle id="rimC" fill="none" stroke="var(--red)" stroke-linecap="round"/></svg>

      </button>

          <rect x="6.4" y="4.6" width="4.2" height="14.8" rx="1.6"/>
          <rect x="13.4" y="4.6" width="4.2" height="14.8" rx="1.6"/>
        </svg>
      </button>
      <button class="ctl" id="btnStop" aria-label="stop">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="#fff">
          <rect x="6" y="6" width="12" height="12" rx="2.4"/>
        </svg>
      </button>
    </div>

    <!-- JOB MODE: the one thing the kid can say on this screen, so it is the screen's
         one big bottom button — the same slot and the same shape Start uses on the set
         screen and Done uses after the hatch. It is not one of the round #runCtl
         controls: those are wordless by design and this is the primary action, which
         on this screen has always been a labelled pill.
         ⚠️ IT CARRIES WORDS. Andjroo has ruled against a bare glyph twice — the
         unlabelled circular-arrow on the demo page ("hard to understand what that even
         means") and PR #94 R3, reversed to put labels back under the sheet tiles. The
         text arrives from the host, because the app has five locales and this file has
         none.
         ⚠️ TEAL, not a new green. The reference's green was a second accent doing
         nothing the teal was not already doing, so Start, the selection band, the
         chosen tiles and the bubble are one accent — and so is this. -->
    <button class="bigbtn" id="btnJobDone" hidden></button>
  </section>

  <!-- ================= HATCH ================= -->
  <section class="screen" id="scHatch">
    <div id="hatchClock"></div>
    <button class="bigbtn" id="done">Done</button>
  </section>


</div>

<!-- ⚠️ THE SCRIM IS THE SCREEN, THE SHEET IS THE COLUMN, and they had to leave #app to
     be both. While these lived inside the 430px column the dim went with them, so on the
     tablet a sheet came up over a fully-lit background with a dimmed stripe behind it —
     the column showing through as a bright-edged panel. Out here the scrim covers
     everything the kid can see; #sheetCol re-imposes the column on the sheets alone, so
     not one sheet rule below had to change. -->
<div id="overlay">
  <div id="scrim"></div>
  <div id="sheetCol">
  <!-- ================= SHEETS ================= -->

    <!-- ⚠️ ONE close button, written once and stamped into all four on boot. The old
         markup had four hand-written ✕ glyphs and they had already drifted — one sheet
         carried a dead "?" beside it, two carried a spacer span, and a fix to "the ✕"
         meant finding every copy. `sclose()` below is the only definition. -->
    <section class="sheet" id="shReminder">
      <div class="shead"><h2>Add a Reminder</h2></div>
      <div class="ssub">Remind your child what to do next when the timer ends.</div>
      <div class="sbody"><div class="grid3" id="remGrid"></div></div>
    </section>

    <section class="sheet" id="shEgg">
      <div class="shead"><h2>Hatch Surprises</h2></div>
      <div class="ssub">Who can come out of the egg.</div>
      <div class="sbody"><div class="grid4" id="eggGrid"></div></div>
      <input id="shoot" type="file" accept="image/*" capture="environment" hidden />
    </section>

    <section class="sheet" id="shMusic">
      <div class="shead"><h2>Sounds</h2></div>
      <div class="ssub">One while the timer runs, one for when it ends.</div>
      <div class="sbody" id="musicBody"></div>
    </section>

    <section class="sheet" id="shBg">
      <div class="shead"><h2>Background</h2></div>
      <div class="ssub">Fills the screen while you set the timer, then becomes the circle.</div>
      <div class="sbody"><div class="grid4" id="bgGrid"></div></div>
    </section>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

<!-- the review strip, outside #app so a sheet's screen-wide scrim cannot bury it -->
<div id="dev">
  <b>pie</b>
  <button data-pie="badge">top left</button>
  <button data-pie="clock">by the clock</button>
  <button data-pie="rim">the rim itself</button>
  <b style="margin-left:6px">go</b>
  <button id="dvHatch">hatch now</button>
  <button id="dvReset">reset</button>
  <span style="flex:none;margin-left:auto;background:var(--teal);color:#fff;
               padding:5px 10px;border-radius:500px" id="dvBuild"></span>
</div>

<!-- last, and outside #app, so it covers the desktop letterbox too. See the CSS. -->
<div id="preboot"></div>

<script type="module">
/* ⚠️ MINTED IN THE HEAD, READ HERE. The head needs both to preload the background
   before this module exists; deriving the same strings twice is how the preload and
   the real request end up with different `v` and the 96KB is fetched twice. */
const BUILD=window.TIMER_BUILD;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const Q=new URLSearchParams(location.search);
const CLEAN=Q.has('clean');
if(CLEAN)$('dev').classList.add('off');

/* ---------- JOB MODE ----------
   The same screen, opened against one of the kid's jobs instead of against nothing.
   Andjroo, 2026-08-01: tapping "use timer" on a job card showed a DIFFERENT egg from
   the one the dock opens — a placeholder SVG (kid/js/egg.js) that predates this rig
   and was never swapped. One egg everywhere; this is how the job reaches this screen.

   Everything below is gated on the flag and nothing above it changes, so the dock
   timer and the standalone tuning host behave exactly as they did.

   What job mode is: the length is the JOB's, so the dial has nothing to spin and the
   +/- steppers would lie about a duration the server owns. What it is not: a second
   clock. The app's countdown stays authoritative and corrects ours through `sync`
   (see RIG.setLeft in wiggle.html) — a job's clock is the server's.

   ⚠️ THE HOST OWNS EVERY WORD. This file has no i18n and the app has five locales,
   so labels arrive in `init` rather than being written here. English below is the
   standalone fallback, not a default the app can accidentally ship. */
const JOB=Q.has('job');
const JT={ secs:0, title:'', emoji:'', started:false,
           s:{ start:'Start', done:"I'm done!" } };
/* the host is the app frame; standalone there is no host and post() is a no-op that
   keeps every call site free of a null check. */
const HOST=(JOB&&window.parent!==window)?window.parent:null;
const post=(k,d)=>{ if(HOST)HOST.postMessage({job:k,...d},'*') };

/* Swapped in SYNCHRONOUSLY, before the first layout() and while #preboot still
   covers the screen, so job mode is never a second arrangement the kid watches the
   screen change into. tools/eggtimer-rawdom.py is what holds that line. */
function applyJob(){
  if(!JOB)return;
  /* What job mode takes away, and why each one:
       cols     the length came with the job; there is nothing to spin
       plus     the reminder is the job — it is already named on the screen
       stepUp   +/- would move a duration the SERVER owns; the clock would say one
       stepDn     thing and the task another
       btnPause the server's clock does not pause, so a pause button would be a
                lie the moment the kid came back. Leaving and returning resumes,
                which is what the back chevron already does. (The job screen it
                replaces had no pause either.)
       btnStop  the host draws a back chevron top-left and leaving is what that is
                for
     — which is all of #runCtl, so the ROW goes rather than its contents: an empty
     flex row still occupying the bottom of the screen is a gap where the kid's one
     button should be.
     ⚠️ Hidden, not removed. layout() still measures and sizes all of them, so job
     mode shares one code path with the dock rather than growing a second. */
  /* ⚠️ THE WHOLE DIAL GOES, not just its columns. The job's name and length used to be
     written across the shell inside #dial — Andjroo, 2026-08-01: "it just doesn't look
     very well positioned on top of the egg". They are a card above the egg now, so
     there is nothing left in #dial to place. */
  for(const id of ['dial','plus','stepUp','stepDn','runCtl']) $(id).hidden=true;
  for(const id of ['jobCard','btnJobDone']) $(id).hidden=false;
}
applyJob();
/* m:ss for the job's length. The run screen's own clock is mmss() further down and
   pads the minutes; a job announced as "05:00" reads like a stopwatch, so the one
   place a duration is stated rather than counted says 5:00. */
const jobClock=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
/* The same fallback chain the app's own card uses: the icon asset, else the emoji,
   else nothing at all rather than a broken-image glyph in the middle of the card. */
function showEmojiIcon(){
  const e=$('jobEmoji');
  e.textContent=JT.emoji||'';
  e.hidden=!JT.emoji;
}

/* ---------- ONE ARRIVAL ----------
   Andjroo, 2026-08-01: "it kind of does it in different parts rather than all being
   loaded at once." It did, and measurably: at 1.6 Mbps the chrome landed at ~200ms,
   the egg at ~1350ms and the background at ~1598ms. Three appearances of one screen.
   The cover (#preboot, see its CSS) holds all three and lets go once — when the
   background has DECODED and the rig has actually put ink on its canvas, which is a
   later moment than the rig merely existing.
   ⚠️ ARMED FIRST. Nothing below this line is allowed to leave the cover up. If the
   rig never hooks, if the art 404s, if layout() throws — the timer arrives at CAP in
   whatever state it got to. A white rectangle that never goes away is a worse bug
   than a staggered load, so the failsafe is set before there is anything that could
   fail.
   ⚠️ CAP IS A BREAKAGE FAILSAFE, NOT A PATIENCE BUDGET, and that is why it is not
   tighter. Measured cold, 390px (tools/whole.py):

       kbps    background   egg drawn   whole
        400        4.63s       5.15s     5.15s
        700        2.63s       2.98s     2.98s
       1600        1.08s       1.35s     1.35s
       4000        0.33s       0.63s     0.63s
       8000        0.20s       0.45s     0.45s

   The two are never more than ~0.35s apart, so waiting for both costs almost nothing
   over waiting for the slower one alone — the whole point of holding them together.
   A cap of 1200ms looked prudent and was not: it fired BEFORE the egg on anything
   under about 1.9 Mbps, which is exactly the connection this was built for, and gave
   back the staggered load it exists to prevent. It is set past the honest 1.6 Mbps
   case instead. Second opens are 0.03s, so this only ever governs a cold one. */
const CAP=2500;
let revealed=false, arrived;
/* what the heavy art waits on. NOT "the egg has inked" — if the background is the
   slow one, starting 2.2MB while it is still in flight is the exact mistake this
   whole change is about. */
const afterReveal=new Promise(r=>{ arrived=r });
function reveal(){
  if(revealed)return; revealed=true;
  arrived();
  const c=$('preboot'); if(!c)return;
  c.classList.add('gone');
  c.addEventListener('transitionend',()=>c.remove(),{once:true});
}
setTimeout(reveal,CAP);
/* the two things that have to be true for the screen to be whole. Each resolves at
   most once and neither can reject the pair — a background that fails to decode is
   still a timer, so it settles rather than holding the cover to the cap. */
let eggInk;
const eggReady=new Promise(res=>{ eggInk=res });
let bgSettle=()=>{};
const bgReady=new Promise(res=>{
  const im=$('bgImg');
  if(!im)return res();
  const done=()=>res();
  bgSettle=done;   // for the paint below to call when there is no scene to load at all
  im.addEventListener('load',()=>{ (im.decode?im.decode():Promise.resolve()).then(done,done) });
  im.addEventListener('error',done);
});
Promise.all([bgReady,eggReady]).then(reveal);

/* ---------- VER: the cache key for everything this page pulls ----------
   ⚠️ NOT the same thing as BUILD. BUILD is hand-typed and says which draft this is;
   VER is what every asset URL is stamped with, and the host supplies it. Standalone
   there is no host and BUILD stands in — the review server is `no-store` anyway, so
   nothing there can go stale. In the app the server mints VER from the vendored
   timer's own file times (src/timer-build.ts), which is the only version that
   cannot be forgotten: editing a file changes it whether or not anyone bumps BUILD.
   ⚠️ The app serves `/kid/timer/*?v=…` as IMMUTABLE off the back of this. A URL
   that is not stamped with VER is a URL that gets re-downloaded on every open;
   one stamped with a STALE VER is a file that can never arrive. Use VER.
   ⚠️ Read back from the head, not re-derived — see the BUILD note above. */
const VER=window.TIMER_VER;

/* ⚠️ BOTH builds, unmissable. Andjroo, 2026-07-31: "I'm still seeing the exact
   same version" — three rounds of work reached the Mini and the tunnel and never
   his phone, and there was nothing on screen that would have told him. */
$('dvBuild').textContent=BUILD+' · rig …';


/* ---------- what the parent has chosen ----------
   ⚠️ bump LS whenever a default changes, or the new one silently loses to whatever
   is already in the browser. `kidtimer2` = the pie moved to the top left corner. */
/* ⚠️ kidtimer3, because the DEFAULT changed. Andjroo, 2026-07-31: "instead of the pie
   chart... it should be that red circle that goes around the edge." The rim was already
   one of the three placements behind the review strip; it is the one that ships. Every
   browser that has run this carries pie:'badge' in kidtimer2, and a stored value beats a
   new default every time — which is exactly the trap the old key's own comment warns
   about. Bump the key whenever a default changes. */
const LS='kidtimer3';
/* ⚠️ `during` IS A BED, NOT 'none'. Andjroo, 2026-08-27, on the run after sound came
   back: sound being ON is not the same as sound being HEARD — the sheet still opened
   with "No music" ticked, so the fix he asked for landed and the timer still ran in
   silence until he went and picked something. 'bounce' rather than 'lullaby' because
   the reminder list this timer is built around is mostly get-ready (shoes on, get
   dressed, brush teeth, clean up, time to eat) and a lullaby at 7am is the wrong
   room; Lullaby is one tap away on the same sheet for the ones that are bedtime.
   ⚠️ 'none' STAYS THE FIRST TILE. It is a real choice and it is where a parent looks
   to turn the music off — this changes which tile arrives ticked, not the lane. */
const S={min:2, sec:0, bg:'city', heroes:null, reminder:'off',
         during:'bounce', end:'chime', muteMusic:false, muteBell:false,
         pie:'rim', pieXY:null};
try{ Object.assign(S, JSON.parse(localStorage.getItem(LS)||'{}')) }catch(e){}
/* ⚠️ MIGRATED, NOT BUMPED. `hero` was one id; it is a LIST now (Andjroo, 2026-07-31 —
   "I want the kid to be able to select multiple characters, so that way it's
   randomized as well"). Bumping LS would have taken his background, his reminder and
   his sounds down with it for a field that translates in one line. */
if(S.hero&&!S.heroes){ S.heroes=[S.hero] }
delete S.hero;
if(S.heroes&&!Array.isArray(S.heroes))S.heroes=[S.heroes];
const save=()=>{ try{ localStorage.setItem(LS,JSON.stringify(S)) }catch(e){} };

/* ⚠️ MIGRATED, NOT BUMPED, the same call as the `hero` -> `heroes` line above — and it
   sits below `save` because it is the one migration that has to WRITE. The hatch default
   changed from one animal to all of them (see heroSet), and this file's own rule says
   bump LS when a default changes — but S.heroes was MATERIALISED into storage the first
   time the roster loaded, so every tablet that has ever opened the timer carries
   ["hero-bear"] and would beat the new default forever. Bumping the key would take the
   background, the reminder and the sounds with it for a field that translates in one
   line. Clearing it lets heroSet() re-derive.
   ⚠️ AND ONLY A SET THAT IS INDISTINGUISHABLE FROM THE OLD AUTO-DEFAULT. A stored set
   of one is what the old floor produced on its own; two or more is somebody's actual
   choice and this must not reach into it. Latched, so a kid who then picks exactly one
   animal on purpose keeps it. */
if(!S.allHeroesDefault){
  S.allHeroesDefault=1;
  if(!S.heroes||S.heroes.length<=1)S.heroes=null;
  save();
}
/* ⚠️ AND THE SAME CALL FOR THE BED, for the same reason: `during` was written to
   storage the first time anything on the sounds sheet was touched, so a new default
   loses to a stored 'none' forever. Only 'none' is converted, because 'none' is what
   the old default produced on its own — any other value is somebody's pick.
   ⚠️ THE WINDOW IS WHY THIS IS SAFE. Sound was globally off from 2026-08-03 to
   2026-08-27 (see SOUND_ON), so nobody could have chosen 'none' by listening to the
   alternatives and preferring silence. Latched, so a parent who turns the music off
   after this ships keeps it off. */
if(!S.bedDefault){
  S.bedDefault=1;
  if(S.during==='none')S.during='bounce';
  save();
}

/* ⚠️ THE BACKGROUND IS ASKED FOR THE LINE AFTER IT IS KNOWN. This used to sit down
   with the background picker, 600 lines below, which meant the <img> did not start
   decoding until every grid, lane and handler in this file had been built. The head
   has already put the same URL in flight (see the preload up there) — this is the
   element adopting that response, so the two must agree on `v` exactly. */
/* Scenes were [city, meadow, ocean, space] until 2026-09-15; the JPEGs left with the rest of
   the generated art and the list is empty until the new ones land (the head script owns it,
   so the preload and this agree). A stored S.bg that names nothing keeps the white stage: an
   <img> that never gets a src draws nothing, and bgReady is settled by hand so the reveal
   does not sit on the CAP waiting for a load that was never started. */
const BGS=window.TIMER_BGS||[];
const bgSrc=k=>BGS.some(([id])=>id===k)?'bg/'+k+'.jpg?v='+VER:null;
if(bgSrc(S.bg))$('bgImg').src=bgSrc(S.bg); else bgSettle();   // no load, no wait: reveal on the egg alone
/* Andjroo's list, in his order: "there's an off button, there's a good job, you did
   it, hooray... time to get ready, time to clean up, time to brush your teeth."
   The glyphs are monoline stand-ins — the illustrated set is an art pass. */
const REMINDERS=[
  ['off','Off'],['goodjob','Good job'],['youdidit','You did it'],['hooray','Hooray'],
  ['love','Love you'],['shoes','Shoes on'],['socks','Get dressed'],
  ['bath','Bath time'],['bed','Bedtime'],['tidy','Clean up'],
  ['teeth','Brush teeth'],['eat','Time to eat'],['screenoff','Screens off'],
];
/* Andjroo, 2026-07-31: "add a 'no music' option at the end" meant ADD ONE — the END
   LANE had no way out at all, only the during lane did. Read as a position instead, it
   moved the during lane's opt-out to last, and he corrected it: "the no music part
   should be the first thing on the sounds page." Off is the first choice in both
   lanes now, the way Off is the first tile on the reminder sheet. */
const DURING=[['none','No music'],['lullaby','Lullaby'],['bounce','Bouncy'],['space','Floaty'],['clock','Ticking']];
const ENDING=[['none','No sound'],['chime','Chime'],['fanfare','Fanfare'],['bell','Bell'],['cheer','Kids cheer'],['pop','Pop']];
/* which cracks the app rolls between. ⚠️ ASK THE RIG, never write the list down.
   This was `[1,2,3,4,5]` and the set became four on 2026-08-22: rollFrom() kept
   offering 5, setPattern(5) refused it, rollPattern() returned null WITHOUT
   updating lastPat, and the next roll was then free to repeat the one just
   played. So a stale literal did not fail loudly — it quietly broke the
   never-twice-running rule, which is the exact complaint the roll exists to fix
   (tools/crackroll.py caught it, nine repeats in forty runs).
   RIG.patterns() is cut by crack_art.py and cannot drift from the art. */
let CRACK_PATTERNS=[];

/* ---------- the rig ---------- */
const rigFrame=$('rig');
/* ⚠️ VER, not BUILD — the rig is 196KB and it must be cacheable in the app, so
   the URL has to change whenever the vendored copy does. The rig reads this `v`
   back out and stamps its OWN art with it (see wiggle.html), so one token from
   the server versions every byte under /kid/timer/. */
rigFrame.src='wiggle.html?embed=1&v='+encodeURIComponent(VER);
let RIG=null, GEO={stage:{w:720,h:560}, egg:{x:179,y:70,w:362,h:432}, ring:{x:360,y:280,r:262}};
let heroes=[];
/* ⚠️ THE HOST CAN SPEAK BEFORE THE RIG EXISTS. `init` arrives as soon as the host
   sees this document, and hooking window.RIG is a poll against an iframe that is
   still loading 196KB — so a job that is already running would ask a null rig to
   resume. Anything in job mode that touches RIG waits on this instead of assuming. */
let rigOk; const whenRig=new Promise(r=>{ rigOk=r });

rigFrame.addEventListener('load',()=>{
  const w=rigFrame.contentWindow;
  const tryHook=()=>{
    if(w.RIG){ RIG=w.RIG; GEO=RIG.geom(); heroes=RIG.heroes();
      $('dvBuild').textContent=BUILD+' · '+RIG.build;
      /* ⚠️ `heroes` is the DRAWN roster, read once, here. The kid's photos are
         pushed into the rig straight after, so re-reading RIG.heroes() later would
         hand back the drawn ones AND the photos and the grid would show every
         photo twice. buildEggGrid() joins the two lists itself. */
      /* ⚠️ The photos have to be registered BEFORE the set is read back, or a kid's
         own character is filtered out of its own selection as a dead id and the
         first tap after a reload silently re-adds it. */
      Promise.all(PHOTOS.map(p=>RIG.addHero(p.id,p.name,p.src)))
        .then(()=>{ S.heroes=heroSet(); save(); if(rebuilt('shEgg'))buildEggGrid() });
      S.heroes=heroSet();
      $('dotEgg').style.display=heroSet().length?'block':'none';
      /* ⚠️ FACE ON IN JOB MODE. sleep() is faceless because the dial used to be written
         across the shell; a job says itself in the card above the egg, so the shell is
         bare and a bare faceless shell is just an egg nobody has met. See RIG.rest(). */
      if(JOB&&RIG.rest)RIG.rest(); else RIG.sleep();
      layout(); rigOk();
      /* ⚠️ THE RIG EXISTING IS NOT THE EGG BEING ON SCREEN. window.RIG is published
         at the end of the rig's start(), one frame before its first draw() — reveal
         on this and the cover comes off an empty canvas. onInk fires on the first
         frame that actually painted. Older rigs have no onInk; treat those as ready
         rather than holding the cover to the cap. */
      RIG.onInk?RIG.onInk(eggInk):eggInk();
      /* ⚠️ AND THE HEAVY ART STARTS ONLY AFTER WE HAVE ARRIVED. 2.2MB of patterns
         and characters used to load the instant the rig's own second wave resolved,
         which is still inside this screen's load — it is what made a 96KB background
         take 1.28s. The ticked characters go first because a run rolls only between
         those; the rest follow on idle. */
      if(RIG.loadRest)afterReveal.then(()=>RIG.loadRest(heroSet())); }
    else setTimeout(tryHook,60);
  };
  tryHook();
});

/* ---------- layout: every number here is a share of the phone, not a pixel ----------
   The two egg positions are computed from what the rig MEASURES (RIG.geom()), so a
   recut of the art moves the badge with it instead of leaving the egg off-centre. */
const L={};
function layout(){
  const W=$('app').clientWidth, H=$('app').clientHeight;
  L.W=W; L.H=H;
  L.cx=W/2;
  L.badgeR=Math.min(W*.44, H*.21);
  L.badgeY=H*.35;
  // the egg on the set screen: the ref's egg is ~77% of the width, centred at 35%
  /* ⚠️ JOB MODE MOVES THE EGG DOWN AND IN, and it has to. At .35 with a .44 height the
     shell's top edge lands ~110px down a 844px phone, and the mutes and the host's back
     chevron already live in most of that — so a card above the egg had about 60px to
     exist in and needs half as much again. This is the one number that buys the space
     the card is meant to occupy; everything else on the screen is placed off H. */
  const jobRoom=JOB?.88:1;
  L.setEggH=Math.min(H*.44*jobRoom, W*.95*(GEO.egg.h/GEO.egg.w));
  L.setEggW=L.setEggH*(GEO.egg.w/GEO.egg.h);
  L.setEggY=JOB?H*.43:H*.35;

  /* ⚠️ THE COLUMN'S OWN OFFSET, because the background is not in the column.
     #bgImg and #conf are fixed to the VIEWPORT (see their CSS) while every number
     above is a share of #app, so anything handed to the background has to cross that
     gap. On a phone the column IS the screen and SX is 0, which is why this reads as
     the same code it was; on the tablet it is what keeps the disc on the egg instead
     of opening 300px to its left. SW/SH are read off the background itself rather
     than from window.inner*, so the iframe the app hosts this in is measured and not
     the browser window behind it. */
  const SW=$('bgImg').clientWidth||W, SH=$('bgImg').clientHeight||H;
  const SX=Math.round((SW-W)/2);

  // scene clip: wide open on set, the badge on run/hatch
  const set=document.body.classList.contains('set');
  // ⚠️ the FULL screen's diagonal, not the column's, or the corners stay unpainted
  $('bgImg').style.setProperty('--clipR', set? Math.hypot(SW,SH)+'px' : L.badgeR+'px');
  $('bgImg').style.setProperty('--clipX', (SX+L.cx)+'px');
  $('bgImg').style.setProperty('--clipY', (set? SH/2 : L.badgeY)+'px');

  // the rig itself: scale + place so the right thing lands in the right spot
  let k,tx,ty;
  if(set){ k=L.setEggH/GEO.egg.h;
           tx=L.cx-(GEO.egg.x+GEO.egg.w/2)*k; ty=L.setEggY-(GEO.egg.y+GEO.egg.h/2)*k }
  else   { k=L.badgeR/GEO.ring.r;
           tx=L.cx-GEO.ring.x*k;              ty=L.badgeY-GEO.ring.y*k }
  const rw=$('rigWrap');
  rw.style.left=tx+'px'; rw.style.top=ty+'px';
  rw.style.width=(720*k)+'px'; rw.style.height=(560*k)+'px';

  const rim=$('badgeRim');
  rim.style.cssText+=`;left:${L.cx-L.badgeR}px;top:${L.badgeY-L.badgeR}px;
                      width:${L.badgeR*2}px;height:${L.badgeR*2}px`;
  // the canvas is the whole SCREEN now, not the badge and not the column — see #conf
  const cf=$('conf');
  cf.style.cssText+=`;left:0;top:0;width:${SW}px;height:${SH}px`;

  layoutSet(W,H); layoutRun(W,H); placePie();
}

/* How far a text element's INK sits from the centre of its own box, in css px.
   Positive means the ink is low. A Range is the browser reporting where it drew the
   glyphs, so this needs no font metrics, survives a fallback resolving to a different
   face on a different device, and costs one reflow inside a layout that is already
   reading offsetHeight. Returns 0 for anything with no text yet. */
function inkShift(el){
  if(!el||!el.firstChild)return 0;
  const rg=document.createRange(); rg.selectNodeContents(el);
  const r=rg.getBoundingClientRect(); if(!r.height)return 0;
  const b=el.getBoundingClientRect();
  return (r.top+r.bottom)/2-(b.top+b.bottom)/2;
}

function layoutSet(W,H){
  const eggT=L.setEggY-L.setEggH/2, eh=L.setEggH;
  const d=$('dial');
  d.style.cssText+=`;left:0;right:0;top:${eggT+eh*.20}px`;
  $('dialTitle').style.fontSize=Math.round(eh*.105)+'px';
  /* ⚠️ A JOB'S NAME IS NOT "Set Timer". #dial is pinned left:0/right:0 so the title
     can centre on the phone, and a two-word label never noticed — but "Put your
     laundry away" inherited that full width and ran clean off both sides of the egg,
     with the emoji pushed past the screen edge. The title belongs INSIDE the egg it
     is written on, so in job mode it is measured against the egg and not the phone:
     narrower, a size down, and clamped to two lines rather than growing until it
     pushes the time out of the shell. */
  if(JOB){
    const tw=Math.round(L.setEggW*.80);
    $('dialTitle').style.cssText+=`;font-size:${Math.round(eh*.082)}px;max-width:${tw}px;
       margin:0 auto;line-height:1.12;display:-webkit-box;-webkit-line-clamp:2;
       -webkit-box-orient:vertical;overflow:hidden`;
  }

  const rowH=Math.round(eh*.125), colW=Math.round(L.setEggW*.30);
  $('cols').style.marginTop=Math.round(eh*.03)+'px';
  /* JOB MODE: the card sits in the gap above the shell, its triangle just touching the
     top of the egg. Measured AFTER it has its content — the card is two lines for a
     long job title and one for a short one, and it has to hang off the egg either way
     rather than off a guessed height. */
  if(JOB){
    const card=$('jobCard');
    /* ⚠️ SCALED TO THE PHONE, like everything else on this screen. The vendored tooltip
       is a fixed 14px card built for a desktop wallet; dropped in at that size next to a
       320px egg and a 40px clock it reads as a footnote. The component's PROPORTIONS are
       what carry the style — padding, radius and the arrow all stay in ratio to the text
       exactly as tooltip.css has them — while the text itself comes off the egg, which is
       the one thing on this screen every other size is derived from. */
    /* ⚠️ TUNED AGAINST THE CHEVRON, not by eye. The card is anchored to the egg and
       grows UPWARD, so its type size decides how far up it climbs — and the host's back
       chevron ends at 58px. At .085 (28px) a two-line title put the card's top at y=11,
       clean through it. At the first attempt's flat 14px it read as a footnote next to a
       320px egg and a 60px clock. This sits between the two and keeps a two-line card
       clear of the chevron at both phone widths. */
    const fs=Math.round(clamp(eh*.062,15,22));
    $('jobName').style.fontSize=fs+'px';
    $('jobTime').style.fontSize=Math.round(fs*.88)+'px';
    for(const id of ['jobIcon','jobEmoji']) $(id).style.cssText+=
      `;width:${Math.round(fs*2)}px;height:${Math.round(fs*2)}px;font-size:${Math.round(fs*1.5)}px`;
    $('jobCardBox').style.cssText+=`;gap:${Math.round(fs*.7)}px;
       padding:${Math.round(fs*.75)}px ${Math.round(fs*.95)}px;
       border-radius:${Math.round(fs*.42)}px`;
    $('jobArrow').style.cssText+=`;width:${Math.round(fs*1.3)}px;height:${Math.round(fs*1.15)}px`;
    /* ⚠️ ANCHORED BY ITS BOTTOM, 10px clear of the shell — NOT by a top computed from a
       measured height. Measuring is a race this screen loses: layout() runs when `init`
       arrives, the icon is an <img> that has not loaded yet, and the card is two lines
       shorter than it will be. Positioning its top off that height then let it GROW
       DOWNWARD onto the egg the moment the icon landed — a wrong position that only
       appears on the frame after the one you are looking at. Anchored at the bottom it
       grows upward, into the empty space that is there for it, and no measurement or
       reload hook is involved.
       ⚠️ The mutes are NOT a constraint above it: `body.set #mutes{display:none}`. The
       host's back chevron is (safe-area + 14px, 44px tall, at left:16), and the name is
       clamped to two lines so the card cannot climb into it. */
    /* ⚠️ Only the BOTTOM is set here. The top is a CSS floor carrying env() (see the
       rule), because the inset is not knowable to script — writing a top from JS would
       silently drop the one constraint that only exists on a real device. */
    card.style.cssText+=`;bottom:${Math.round(H-(eggT-10))}px`;
  }
  for(const h of ['hMin','hSec']) $(h).style.cssText+=`;font-size:${Math.round(eh*.062)}px;width:${colW}px`;
  for(const c of ['colMin','colSec']){
    const el=$(c);
    el.style.cssText+=`;width:${colW}px;height:${rowH*3}px;padding:${rowH}px 0`;
    el.querySelectorAll('.n').forEach(n=>{ n.style.height=rowH+'px'; n.style.fontSize=Math.round(rowH*.86)+'px' });
  }
  /* ---------- the band sits behind the middle row, ON THE INK ----------
     Andjroo, 2026-08-01: "on the green selector where it's over the two minutes, the
     starting position, it's like at the bottom rather than centered. It just needs to
     move down slightly and center on the time."

     He is right, and it was not the band: the band's box and the row's box are exactly
     co-located, to 0.0px. It is the DIGITS that sit low inside their own row — measured
     6.68px low at 390px — so a band centred on the row reads high against every number
     in the column.

     ⚠️ MEASURED PER RENDER, NOT A CONSTANT, AND NOT THE FONT'S METRICS. The obvious
     derivation — half the font's ascent/descent against half the glyph's — predicts
     -0.28px where the pixels say +6.68px, because it models where `place-items:center`
     puts the baseline and gets it wrong. And a constant taken from this box would be
     the wrong constant on Andjroo's phone: the whole point of the font stack is that it
     resolves to SF Pro Rounded there and to something else in a headless render, with
     a different ink box. A Range over the text is the browser telling us where it
     actually drew, and it tracked the rendered pixels to 0.32px. */
  const headH=$('hMin').offsetHeight||Math.round(eh*.08);
  const rowInk=inkShift($('colMin').querySelector('.n'));
  $('band').style.cssText+=`;top:${headH+rowH+rowInk}px;height:${rowH}px`;
  /* the colon lands its OWN ink on the line the digits' ink sits on — it is smaller
     text in the same font, so its offset is its own and sizing has to come first. */
  $('colon').style.cssText+=`;top:${headH+rowH*1.5+rowInk}px;font-size:${Math.round(rowH*.7)}px`;
  $('colon').style.top=(headH+rowH*1.5+rowInk-inkShift($('colon')))+'px';

  // the bubble's art is 100 wide but its disc is only 64 of that, so the box is
  // scaled off the disc — otherwise the tail's overhang shrinks the + itself
  /* ⚠️ THE SHOULDER, BUT ON SCREEN. The bubble is placed off the egg's own width, and
     the egg is as wide as the phone lets it be — so on a 360px phone the shoulder is
     already past the right edge and the bubble hung 6px off it. (4px of that predates
     the geom fix; reading the DRAWN curve made the egg 2% wider for the same height,
     which pushed it the rest of the way.) `right` is not a taste margin, it is where
     the mutes sit, so the bubble stops on the same line the rest of the chrome does. */
  const pw=Math.round(Math.min(92,L.setEggW*.31));
  const px=Math.min(L.cx+L.setEggW*.30, W-14-pw);
  $('plus').style.cssText+=`;width:${pw}px;height:${pw}px;
      left:${px}px;top:${eggT-eh*.02}px`;

  const sh=Math.round(Math.min(76,H*.09));
  $('start').style.cssText+=`;top:${H*.69-sh/2}px;height:${sh}px;font-size:${Math.round(sh*.52)}px`;

  const tb=Math.round(Math.min(64,W*.165));
  $('tray').style.cssText+=`;top:${H*.88-tb/2}px;gap:${Math.round(tb*.42)}px`;
  document.querySelectorAll('.trayb').forEach(b=>{ b.style.width=tb+'px'; b.style.height=tb+'px' });
}

function layoutRun(W,H){
  /* The countdown row is sized from what is left, not from a chosen number. With
     the pie beside the clock there is ~60px less to spend, so the digits come down
     a size — that trade is real and it is the reason to look at all three. */
  const inRow=(S.pie==='clock' && !S.pieXY);
  const pieW=inRow?Math.round(Math.min(62,W*.16)):0;
  const gap=Math.round(inRow?W*.028:W*.045);
  const st=Math.round(Math.min(inRow?42:50,W*.125));
  const room=W-28-pieW-st*2-gap*(inRow?4:2);
  const cs=Math.round(clamp(room/3.05, 42, Math.min(66,W*.17)));
  $('clockRow').style.cssText+=`;top:${H*.665-cs*.7}px;gap:${gap}px`;
  $('clock').style.fontSize=cs+'px';
  document.querySelectorAll('.step').forEach(b=>{ b.style.width=st+'px'; b.style.height=st+'px' });

  const cw=Math.round(Math.min(112,W*.30)), ch=Math.round(cw*.72);
  $('runCtl').style.cssText+=`;top:${H*.845-ch/2}px`;
  document.querySelectorAll('.ctl').forEach(b=>{ b.style.width=cw+'px'; b.style.height=ch+'px' });
  $('done').style.cssText+=`;top:${H*.845-ch/2}px;height:${ch}px;font-size:${Math.round(ch*.52)}px`;
  /* JOB MODE: the same box as the hatch's Done, one screen earlier. Sized off ch like
     Done rather than off the set screen's `sh`, because it sits at .845 with Done and
     not at .69 with Start — the slot decides the size, not the role. */
  $('btnJobDone').style.cssText+=`;top:${H*.845-ch/2}px;height:${ch}px;font-size:${Math.round(ch*.52)}px`;
  $('hatchClock').style.cssText+=`;position:absolute;left:0;right:0;text-align:center;
     top:${H*.665-cs*.7}px;font-size:${cs}px;font-weight:800;color:var(--ink);
     font-variant-numeric:tabular-nums;letter-spacing:-1px`;

  /* ---------- the reminder, still on screen while the clock runs ----------
     Andjroo, 2026-08-27: he chose "thumbs up" / "shoes on", pressed Start, and the
     pick "just goes away". Same bubble as the set screen, moved onto the badge's
     upper-right shoulder so the egg is still the thing saying it.
     ⚠️ OUTSIDE THE RIM ARC, not tangent to the badge. When S.pie is 'rim' the red
     countdown ring is drawn at badgeR + 10 (placePie), so a bubble placed off badgeR
     alone sits under it for the whole run. `pr` clears the ring at its widest.
     ⚠️ .72 on both axes puts the disc at 45°, which is where it sits on the set
     screen too — the shoulder, not the corner. */
